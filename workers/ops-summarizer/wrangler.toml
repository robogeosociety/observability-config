# ops-summarizer — the handler behind fleet-bus's `work` topics.
#
# Two lanes: GitHub notifications, and repeated #ops alarms explained against the
# dev vault. Turn-limited (see src/llm.js) and quota-aware — it answers 429 or
# 200 {parked:true} so fleet-bus parks the queue instead of dead-lettering a
# backlog when the token quota is gone.
name = "ops-summarizer"
main = "src/index.js"
compatibility_date = "2026-07-01"
workers_dev = true

# Workers AI: embeddings for retrieval (@cf/baai/bge-base-en-v1.5, 768 dims).
# The summary itself is Claude Haiku over the Anthropic API — Workers AI does not
# host Claude, which is why this Worker needs ANTHROPIC_API_KEY at all.
[ai]
binding = "AI"

# The dev vault, mirrored from the mini's vecserve index. Deliberately a second
# embedding of the same corpus with a different model: reaching vecserve through
# the tunnel would put this lane back on the host whose disk wedges.
[[vectorize]]
binding = "VECTORIZE"
index_name = "obsidian-vaults"

[vars]
# Which vaults the repeated-alarm lane retrieves from. A Worker is a bundle and cannot
# read a file at runtime, so this mirrors [consumers.alarms] in vaults.toml — which is
# the authoritative copy. test/vault-policy.test.mjs fails if the two drift, because a
# consumer quietly reading vaults nobody granted it is the failure worth catching.
ALARM_VAULTS = "dev"

# Turn ceiling passed through to the Actions run and shown in the #ops footer.
MAX_TURNS = "3"

# Where repository_dispatch lands. The model runs there, not here — subscription
# auth lives in the Claude CLI and a Worker cannot run the CLI.
DISPATCH_REPO = "robogeosociety/observability-config"

# fleet-bus, for forwarding acks once a run finishes.
BUS_URL = "https://fleet-bus.tommy-b-doerr.workers.dev"

# Origins permitted to reach /mcp, comma-separated. MCP clients are not browsers
# and send no Origin, which is allowed; this only constrains callers that DO send
# one. Required by the transport spec as DNS-rebinding protection.
MCP_ALLOWED_ORIGINS = ""

# Secrets (wrangler secret put):
#   HANDLER_TOKEN         — bearer fleet-bus and the workflow present
#   WEBHOOK_OPS           — #ops webhook the finished summary is posted to
#   BUS_TOKEN             — bearer for fleet-bus /ack
#   APP_ID / APP_PRIVATE_KEY — the rgs-deploy-gate GitHub App, reused rather than
#                              minting a second long-lived GitHub credential
#
# Deliberately NOT here: ANTHROPIC_API_KEY. This lane runs on the subscription
# via `claude -p` in Actions; a key here would be a second, metered path to the
# same answers.
