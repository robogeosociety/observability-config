[project]
name = "ask-dash"
version = "0.1.0"
description = "Read-only natural-language Q&A over the local Grafana/InfluxDB stack, via Discord and Claude CLI (MCP)."
requires-python = ">=3.11"
dependencies = [
    "influxdb-client>=1.43",
    "requests>=2.31",
    "anthropic>=0.40",
    "discord.py>=2.4",
    "mcp>=1.2",
]

[project.scripts]
ask-dash = "ask_dash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ask_dash"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = ["pytest>=8"]
