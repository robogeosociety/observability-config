# Telegraf — Home Assistant host system metrics for the `system` InfluxDB bucket.
#
# Canonical, version-controlled config for the HA box. Unlike the Mac's Telegraf
# (native Homebrew + deploy.sh), this runs as the **Telegraf add-on** on Home
# Assistant OS — there is NO deploy.sh here. Paste this into the add-on's
# configuration in the HA UI (Settings → Add-ons → Telegraf → Configuration).
# See README.md.
#
# Feeds the "Home Assistant — System" Grafana dashboard (uid: ha-system), which
# filters by host tag "homeassistant".

[agent]
  interval = "15s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "2s"
  flush_interval = "15s"
  flush_jitter = "3s"
  precision = "1s"
  hostname = "homeassistant"      # MUST match the ha-system dashboard's $host
  omit_hostname = false

# Output → InfluxDB 2.7 on the Mac mini.
# HA (192.168.4.x) and the mini (192.168.5.x) are on different subnets and the
# mini is NOT on the tailnet from HA, so use the mini's LAN IP — its .local mDNS
# name will not resolve across subnets. If the mini's IP changes, update here.
[[outputs.influxdb_v2]]
  urls = ["http://192.168.5.232:8086"]
  token = "${INFLUX_TOKEN}"        # the system-bucket write token (see README)
  organization = "home"
  bucket = "system"

# ── CPU ──────────────────────────────────────────────────────────────────
# Overall utilisation only (percpu off). `usage_active` = 100 - usage_idle.
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

# ── Memory & swap ────────────────────────────────────────────────────────
[[inputs.mem]]

[[inputs.swap]]

# ── Disk usage (per volume) ────────────────────────────────────────────────
# Skip container/pseudo filesystems. The add-on runs containerised, so this
# reflects the add-on's mount view of the host volumes.
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay", "squashfs", "aufs", "nullfs", "devfs", "autofs"]

# ── Disk I/O (per device) ──────────────────────────────────────────────────
[[inputs.diskio]]

# ── Network throughput (per interface) ─────────────────────────────────────
[[inputs.net]]

# ── Load average, uptime, n_cpus ───────────────────────────────────────────
[[inputs.system]]
