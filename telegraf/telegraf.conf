# Telegraf — Mac host system + OrbStack container metrics for the `system` bucket.
#
# This is the CANONICAL config (version-controlled). It is NOT read in place:
# `deploy.sh` substitutes ${INFLUX_TOKEN} from telegraf/.env and writes the
# result to the internal-disk path Homebrew's launchd service reads
# (/opt/homebrew/etc/telegraf.conf), then restarts the service. Edit here, then
# run `./telegraf/deploy.sh`. See telegraf/README.md.
#
# Telegraf must run natively on the host (via `brew services`), NOT in a
# container: a container would report the OrbStack Linux VM's metrics, not macOS.

[agent]
  interval = "15s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "2s"
  flush_interval = "15s"
  flush_jitter = "3s"
  precision = "1s"
  hostname = "tommys-mac-mini"
  omit_hostname = false

# Output → InfluxDB 2.7 container (published on the host at :8086).
[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "home"
  bucket = "system"

# ── CPU ──────────────────────────────────────────────────────────────────
# Overall utilisation only (percpu off — this is the "Extended" tier, not
# per-core). `usage_active` = 100 - usage_idle.
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

# ── Memory & swap ────────────────────────────────────────────────────────
[[inputs.mem]]

[[inputs.swap]]

# ── Disk usage (per volume) ────────────────────────────────────────────────
# Skip macOS synthetic/pseudo filesystems so the dashboard shows real volumes
# (/, /System/Volumes/Data, the 2TB /Volumes/dev external disk, …).
[[inputs.disk]]
  ignore_fs = ["devfs", "autofs", "tmpfs", "overlay", "aufs", "squashfs", "nullfs"]

# ── Disk I/O (per device: disk0, disk1s1, …) ───────────────────────────────
[[inputs.diskio]]

# ── Network throughput (per interface) ─────────────────────────────────────
[[inputs.net]]

# ── Load average, uptime, n_cpus ───────────────────────────────────────────
[[inputs.system]]

# ── OrbStack / Docker containers ───────────────────────────────────────────
# Per-container CPU / memory / network / block-IO + engine totals, read from the
# OrbStack Docker socket. /var/run/docker.sock symlinks to OrbStack's socket
# (~/.orbstack/run/docker.sock); Telegraf runs as the host user, which owns it,
# so no extra perms are needed. Metrics land in the same `system` bucket
# (measurements: docker, docker_container_cpu / _mem / _net / _blkio / _status).
# Feeds the orbstack-containers dashboard — lets us spot a container approaching
# its 50% VM cap before it repeats the 2026-05-31 runaway that hung the VM.
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  # Include stopped/dead/restarting states so exits and restart loops are visible.
  container_state_include = ["created", "restarting", "running", "removing", "paused", "exited", "dead"]
  timeout = "5s"
  # Per-container and total rollups for cpu / blkio / network.
  perdevice_include = ["cpu", "blkio", "network"]
  total_include = ["cpu", "blkio", "network"]
