# InfluxDB datasource (conf.d — one file per datasource so concurrent PRs adding a
# bucket never collide on a shared file; Grafana merges every *.yml in this dir).
# Backup heartbeats (measurement `backup`) written by influxdb/backup.sh.

apiVersion: 1
datasources:
- name: InfluxDB - ops
  uid: ops
  type: influxdb
  access: proxy
  url: http://influxdb:8086
  jsonData:
    version: Flux
    organization: home
    defaultBucket: ops
    tlsSkipVerify: true
  secureJsonData:
    token: ${INFLUX_GRAFANA_TOKEN}
  editable: true
