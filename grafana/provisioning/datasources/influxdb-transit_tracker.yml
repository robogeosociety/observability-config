# InfluxDB datasource (conf.d — one file per datasource so concurrent PRs adding a
# bucket never collide on a shared file; Grafana merges every *.yml in this dir).

apiVersion: 1
datasources:
- name: InfluxDB - transit_tracker
  uid: transit_tracker
  type: influxdb
  access: proxy
  url: http://influxdb:8086
  jsonData:
    version: Flux
    organization: home
    defaultBucket: transit_tracker
    tlsSkipVerify: true
  secureJsonData:
    token: ${INFLUX_GRAFANA_TOKEN}
  editable: true
