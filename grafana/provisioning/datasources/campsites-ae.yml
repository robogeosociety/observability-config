apiVersion: 1

# Cloudflare Analytics Engine via the community ClickHouse plugin, which POSTs SQL
# to an arbitrary HTTP endpoint with a custom auth header (the official
# grafana-clickhouse-datasource expects a real ClickHouse server and can't reach
# the AE SQL API). Token: CF_ANALYTICS_TOKEN (Account Analytics: Read).
datasources:
  - name: Campsites AE (Cloudflare Analytics Engine)
    uid: campsites_ae
    type: vertamedia-clickhouse-datasource
    access: proxy
    url: https://api.cloudflare.com/client/v4/accounts/d7adee58513c1b2f770ccaac90cf114f/analytics_engine/sql
    jsonData:
      usePOST: true
      dateTimeColDataType: timestamp
      dateTimeType: "DATETIME"
      addCorsHeader: false
      httpHeaderName1: "Authorization"
    secureJsonData:
      httpHeaderValue1: "Bearer ${CF_ANALYTICS_TOKEN}"
    editable: true
