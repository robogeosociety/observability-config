apiVersion: 1

datasources:
  - name: InfluxDB - tempest_archive
    uid: tempest_archive
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: home
      defaultBucket: tempest_archive
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_GRAFANA_TOKEN}
    editable: true

  - name: InfluxDB - home_assistant
    uid: home_assistant
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: home
      defaultBucket: home_assistant
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_GRAFANA_TOKEN}
    editable: true

  - name: InfluxDB - zigbee_archive
    uid: zigbee_archive
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: home
      defaultBucket: zigbee_archive
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_GRAFANA_TOKEN}
    editable: true

  - name: InfluxDB - transit_tracker
    uid: transit_tracker
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: home
      defaultBucket: transit_tracker
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_GRAFANA_TOKEN}
    editable: true

  # Backup heartbeats (measurement `backup`) written by influxdb/backup.sh.
  - name: InfluxDB - ops
    uid: ops
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: home
      defaultBucket: ops
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_GRAFANA_TOKEN}
    editable: true

  # Campsite availability snapshots (measurement `availability`) written daily
  # by the in-repo ingest job (campsites/ingest.py, launchd 07:30; pulls from R2)
  # — feeds the campsite-availability dashboard. See campsites/README.md.
  - name: InfluxDB - campsites
    uid: campsites
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: home
      defaultBucket: campsites
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_GRAFANA_TOKEN}
    editable: true

  # Mac host system metrics (cpu/mem/swap/disk/diskio/net/system) written every
  # 15s by Telegraf running natively on the host — feeds the mac-system
  # dashboard. See telegraf/README.md.
  - name: InfluxDB - system
    uid: system
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: home
      defaultBucket: system
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_GRAFANA_TOKEN}
    editable: true

  # Mount Rainier visibility predictions + inference-tick health, mirrored from
  # the public is-the-mountain-out R2 bucket (history.jsonl) into the `mountain`
  # bucket by the in-repo ingest job (mountain/ingest.py, launchd every 15 min).
  # Feeds the mountain-status and mountain-infra dashboards. See mountain/README.md.
  - name: InfluxDB - mountain
    uid: mountain
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: home
      defaultBucket: mountain
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_GRAFANA_TOKEN}
    editable: true

  # Claude Code per-message token usage written every 5 min by the in-repo
  # collector (grafana/claude-usage-collector/, launchd com.tommy.claude-usage),
  # parsed from ~/.claude transcripts. Feeds the claude-usage dashboard.
  # See claude-usage-collector/README.md and SPEC-claude-usage.md.
  - name: InfluxDB - claude_code
    uid: claude_code
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: home
      defaultBucket: claude_code
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_GRAFANA_TOKEN}
    editable: true
