apiVersion: 1

# Cloudflare GraphQL Analytics API via the Infinity datasource — used for R2
# bucket storage metrics (stored bytes + object count) on the collector
# dashboard, which the AE SQL API doesn't expose. Auth is the same
# CF_ANALYTICS_TOKEN (Account Analytics: Read) the campsites-ae datasource uses,
# passed as a custom Authorization header (the proven pattern in this repo).
# allowedHosts pins outbound requests to the Cloudflare API.
datasources:
  - name: Cloudflare GraphQL
    uid: cloudflare_graphql
    type: yesoreyeram-infinity-datasource
    access: proxy
    jsonData:
      httpHeaderName1: "Authorization"
      allowedHosts:
        - "https://api.cloudflare.com"
    secureJsonData:
      httpHeaderValue1: "Bearer ${CF_ANALYTICS_TOKEN}"
    editable: true
