# Cloudflare Workers Analytics Engine — the `campsite_collector` dataset emitted
# by the robot-geographical-society collector Workflow. AE's SQL endpoint is
# ClickHouse-compatible, so we use the Altinity ClickHouse plugin (Cloudflare's
# recommended path) pointed at the AE SQL API with a Bearer token custom header.
#
# Requires: the `vertamedia-clickhouse-datasource` plugin (GF_INSTALL_PLUGINS in
# docker-compose.yml) and CF_ANALYTICS_TOKEN in grafana/.env (Account Analytics:
# Read, read-only). See cloudflare-collector/README.md.
apiVersion: 1

datasources:
  - name: Cloudflare AE - campsite collector
    uid: cloudflare-ae
    type: vertamedia-clickhouse-datasource
    access: proxy
    url: https://api.cloudflare.com/client/v4/accounts/d7adee58513c1b2f770ccaac90cf114f/analytics_engine/sql
    jsonData:
      usePOST: true
      addCorsHeader: false
      # Send the SQL query in the POST body, as the AE SQL API expects.
      httpHeaderName1: "Authorization"
    secureJsonData:
      httpHeaderValue1: "Bearer ${CF_ANALYTICS_TOKEN}"
    editable: true
