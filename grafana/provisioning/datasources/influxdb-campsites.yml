# InfluxDB datasource (conf.d — one file per datasource so concurrent PRs adding a
# bucket never collide on a shared file; Grafana merges every *.yml in this dir).
# Campsite availability snapshots (measurement `availability`) written daily
# by the in-repo ingest job (campsites/ingest.py, launchd 07:30; pulls from R2)
# — feeds the campsite-availability dashboard. See campsites/README.md.

apiVersion: 1
datasources:
- name: InfluxDB - campsites
  uid: campsites
  type: influxdb
  access: proxy
  url: http://influxdb:8086
  jsonData:
    version: Flux
    organization: home
    defaultBucket: campsites
    tlsSkipVerify: true
  secureJsonData:
    token: ${INFLUX_GRAFANA_TOKEN}
  editable: true
