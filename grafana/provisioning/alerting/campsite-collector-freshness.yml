apiVersion: 1

# Campsite collector freshness — page when the deadline-driven CollectorLoop
# stops landing data. The loop (a Cloudflare Worker) writes R2 summary/<date>/
# continuously; the campsites ingest (launchd 07:30 daily, pulls R2 → InfluxDB
# `campsites`) materializes those snapshots into the `availability` measurement.
# If the collector dies, the next daily ingest finds nothing new and the
# measurement goes stale.
#
# This REPLACES the in-Worker liveness supervisor we dropped: instead of a cron
# auto-restarting a dead loop, alert a human, who restarts it with
#   POST /collect/start?force=1   (after checking GET /scheduler/status).
#
# Window = 34h, deliberately > the 24h ingest cadence, so a healthy daily
# snapshot never false-fires, while a dead collector fires ~1 day in — inside the
# 2-day staleness SLA the loop guarantees. noDataState=Alerting: an empty 34h
# window IS the alert. execErrState=OK: an InfluxDB outage is covered by
# influxdb-availability, so don't double-page. Routed to Discord by the root
# notification policy (folder: Alerts).
groups:
  - orgId: 1
    name: campsite-collector
    folder: Alerts
    interval: 10m
    rules:
      - uid: campsite-collector-stale
        title: Campsite collector is stale (no snapshot in 34h)
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: warning
          component: collector
          collector: campsites
        annotations:
          summary: >-
            No new campsite availability snapshots in InfluxDB for 34+ hours. The
            deadline-driven CollectorLoop (Cloudflare Worker) or the 07:30 ingest
            has stalled — every campsite should refresh within 2 days.
          runbook: >-
            Check GET /scheduler/status on the backend Worker. If the heartbeat is
            stale, the loop crashed: restart it with POST /collect/start?force=1.
            If the heartbeat is fresh, the 07:30 R2→InfluxDB ingest is the culprit.
        data:
          - refId: A
            relativeTimeRange:
              from: 122400
              to: 0
            datasourceUid: campsites
            model:
              refId: A
              datasource:
                type: influxdb
                uid: campsites
              query: |
                from(bucket: "campsites")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "availability" and r._field == "available")
                  |> count()
          - refId: B
            relativeTimeRange:
              from: 122400
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 122400
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
