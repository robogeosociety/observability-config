apiVersion: 1

# Campsite collector freshness — page when the deadline-driven CollectorLoop
# stops landing data. The loop (a Cloudflare Worker) writes the `campsite_availability`
# Analytics Engine dataset continuously (one point per campground per target_date,
# every collection). If the collector dies, no new AE rows land and the window
# empties.
#
# Migrated 2026-06-20 off InfluxDB: the host `campsite-ingest` launchd job and the
# `campsites` bucket were retired, so this rule now reads Analytics Engine directly
# (the `campsites_ae` ClickHouse datasource, same source as the failure-ratio rule)
# instead of the daily InfluxDB `availability` measurement. Same uid
# (campsite-collector-stale), so provisioning updates it in place.
#
# This REPLACES the in-Worker liveness supervisor we dropped: instead of a cron
# auto-restarting a dead loop, alert a human, who restarts it with
#   POST /collect/start?force=1   (after checking GET /scheduler/status).
#
# Window = 34h. Writes are now continuous (dozens of availability rows/day), so a
# 34h window with zero rows unambiguously means the collector is dead — well inside
# the 2-day staleness SLA the loop guarantees, with no risk of false-firing on the
# old 24h ingest cadence (which no longer exists). noDataState=Alerting: an empty
# 34h window IS the alert. execErrState=OK: an AE/token hiccup shouldn't page (the
# failure-ratio + InfluxDB-availability rules cover the engine). Routed to Discord
# by the root notification policy (folder: Alerts).
groups:
  - orgId: 1
    name: campsite-collector
    folder: Alerts
    interval: 10m
    rules:
      - uid: campsite-collector-stale
        title: Campsite collector is stale (no snapshot in 34h)
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: warning
          component: collector
          collector: campsites
        annotations:
          summary: >-
            No new campsite availability rows in Analytics Engine for 34+ hours.
            The deadline-driven CollectorLoop (Cloudflare Worker) has stalled —
            every campsite should refresh within 2 days.
          runbook: >-
            Check GET /scheduler/status on the backend Worker. If the heartbeat is
            stale, the loop crashed: restart it with POST /collect/start?force=1.
            Then confirm new rows land in the campsite_availability AE dataset
            (Campsite Availability — Overview dashboard).
        data:
          - refId: A
            relativeTimeRange:
              from: 122400
              to: 0
            datasourceUid: campsites_ae
            model:
              refId: A
              datasource:
                type: vertamedia-clickhouse-datasource
                uid: campsites_ae
              format: time_series
              dateTimeColDataType: timestamp
              dateTimeType: DATETIME
              intervalMs: 60000
              maxDataPoints: 100
              query: >-
                SELECT (intDiv(toUInt32(now()), 60) * 60) * 1000 AS t,
                SUM(_sample_interval) AS rows_seen
                FROM campsite_availability
                WHERE timestamp > now() - INTERVAL '34' HOUR
                GROUP BY t
          - refId: B
            relativeTimeRange:
              from: 122400
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 122400
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
