apiVersion: 1

# Control-loop liveness — the obsidian-control-loop Nomad service (pydoit ns) heartbeats the
# ops bucket (control_loop measurement, alive=1) every ~90s. It owns code-deploy freshness,
# the vault git mirror, and change-driven qwenbot reindex; if it dies the runtime silently
# stops getting new code — the exact drift it was built to end — so page it.
#
# noDataState=Alerting: an empty window (no heartbeat) IS the alert condition.
# execErrState=OK: if InfluxDB itself is unreachable that's the influxdb-down rule's job —
# don't double-page.
groups:
  - orgId: 1
    name: control-loop
    folder: Alerts
    interval: 5m
    rules:
      - uid: obsidian-control-loop-stale
        title: Obsidian control loop is down (no heartbeat in 15m)
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: warning
          component: control-loop
        annotations:
          summary: >-
            No obsidian-control-loop heartbeat (ops bucket, control_loop alive=1) in the last
            15 minutes. The Nomad service may be down — code-deploy freshness, the vault mirror,
            and change-driven qwenbot reindex have all stalled. Check
            `nomad job status -namespace pydoit obsidian-control-loop` and its alloc logs.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: ops
            model:
              refId: A
              datasource:
                type: influxdb
                uid: ops
              query: |
                from(bucket: "ops")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "control_loop" and r._field == "alive" and r._value == 1)
                  |> count()
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
