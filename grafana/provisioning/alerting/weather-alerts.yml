apiVersion: 1

# Tempest weather alerts — actionable thresholds on the backyard WeatherFlow
# Tempest station (st_00204728), read from the home_assistant InfluxDB bucket.
#
# The Tempest lands in InfluxDB via Home Assistant's `influxdb` integration: each
# HA entity becomes a _measurement (e.g. sensor.st_00204728_wind_gust) with a
# single field "value", in IMPERIAL units (mph, °F, in/h). So every rule filters
# `_measurement == "sensor.st_00204728_<x>" and _field == "value"`, takes last(),
# and thresholds it.
#
# noDataState=OK / execErrState=OK on every rule: a feed gap or query error is the
# job of influxdb-availability (single primary detector) + collector-freshness
# (the Tempest-via-HA freshness rule) — these weather rules only fire on a real,
# measured reading, so a Tempest/HA outage doesn't page once per weather rule.
#
# Routing: NO new contact point and NO new root policy here. The existing single
# root policy (notification-policies.yml, receiver: discord) already routes folder
# Alerts → the discord contact point; these land in folder Alerts with label
# `domain: weather` and ride that same path.
groups:
  - orgId: 1
    name: weather
    folder: Alerts
    interval: 1m
    rules:
      # ---- High wind gust: > 40 mph for 5m -------------------------------------
      - uid: weather-wind-gust
        title: High wind gust (Tempest > 40 mph)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          domain: weather
        annotations:
          summary: >-
            Backyard Tempest wind gust is over 40 mph. Secure loose outdoor items
            (umbrellas, canopies, bins) and expect possible power flicker.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: home_assistant
            model:
              refId: A
              datasource:
                type: influxdb
                uid: home_assistant
              query: |
                from(bucket: "home_assistant")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "sensor.st_00204728_wind_gust" and r._field == "value")
                  |> last()
                  |> keep(columns: ["_value"])
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 40

      # ---- Hard freeze: < 28 °F for 1h -----------------------------------------
      - uid: weather-hard-freeze
        title: Hard freeze (Tempest < 28 °F)
        condition: C
        for: 1h
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          domain: weather
        annotations:
          summary: >-
            Backyard Tempest temperature is below 28 °F. Protect pipes, drain hose
            bibs, and cover or bring in sensitive plants — a hard freeze, not a
            light frost.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: home_assistant
            model:
              refId: A
              datasource:
                type: influxdb
                uid: home_assistant
              query: |
                from(bucket: "home_assistant")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "sensor.st_00204728_temperature" and r._field == "value")
                  |> last()
                  |> keep(columns: ["_value"])
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 28

      # ---- Extreme heat: > 90 °F for 30m ---------------------------------------
      - uid: weather-extreme-heat
        title: Extreme heat (Tempest > 90 °F)
        condition: C
        for: 30m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          domain: weather
        annotations:
          summary: >-
            Backyard Tempest temperature is over 90 °F. Hydrate, check on anyone
            without AC, and don't leave pets or anything heat-sensitive outdoors.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: home_assistant
            model:
              refId: A
              datasource:
                type: influxdb
                uid: home_assistant
              query: |
                from(bucket: "home_assistant")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "sensor.st_00204728_temperature" and r._field == "value")
                  |> last()
                  |> keep(columns: ["_value"])
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 90

      # ---- Heavy rain: > 0.3 in/h for 10m --------------------------------------
      - uid: weather-heavy-rain
        title: Heavy rain (Tempest > 0.3 in/h)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          domain: weather
        annotations:
          summary: >-
            Backyard Tempest rain rate is over 0.3 in/h. Watch for localized
            ponding / yard drainage and check gutters and the sump.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: home_assistant
            model:
              refId: A
              datasource:
                type: influxdb
                uid: home_assistant
              query: |
                from(bucket: "home_assistant")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "sensor.st_00204728_precipitation_intensity" and r._field == "value")
                  |> last()
                  |> keep(columns: ["_value"])
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.3
