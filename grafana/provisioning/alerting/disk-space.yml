apiVersion: 1

# "/Volumes/dev is filling up" — the 2TB external disk holds BOTH InfluxDB's live
# data and the backup tarballs, so running it out of space takes the whole stack
# down. telegraf reports disk/used_percent for path=/Volumes/dev to the system
# bucket; alert above 85%.
#
# noDataState=OK / execErrState=OK: a telemetry gap (telegraf or InfluxDB down) is
# the influxdb-down rule's job — this rule only cares about a real high reading.
#
# Second rule: the Mac's internal disk. telegraf reports used_percent for path=
# /System/Volumes/Data (the writable APFS data volume — "/" is the small sealed,
# read-only system snapshot, so it never moves). This is the volume that holds
# ~/Library, Docker/OrbStack, and caches; a runaway cache (e.g. the mediaanalysisd
# e5bundlecache leak) can fill it and stall the whole machine. Alert above 90%.
groups:
  - orgId: 1
    name: host-resources
    folder: Alerts
    interval: 5m
    rules:
      - uid: disk-volumes-dev
        title: /Volumes/dev is filling up (>85% used)
        condition: C
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          component: disk
        annotations:
          summary: >-
            /Volumes/dev is over 85% used. It holds InfluxDB's live data and the
            backup tarballs — free space (old backups in influxdb/backups/) before
            it fills and stalls writes.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: system
            model:
              refId: A
              datasource:
                type: influxdb
                uid: system
              query: |
                from(bucket: "system")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "disk" and r._field == "used_percent" and r.path == "/Volumes/dev")
                  |> last()
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 85

      - uid: disk-mac-root
        title: Mac internal disk is filling up (>90% used)
        condition: C
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          component: disk
        annotations:
          summary: >-
            The Mac's internal disk (/System/Volumes/Data) is over 90% used.
            Check ~/Library/Caches and ~/Library/Containers for runaway caches
            (e.g. the mediaanalysisd e5bundlecache leak), Docker/OrbStack data,
            and ~/Downloads before it fills and stalls the machine.
          runbook: |
            Most likely the mediaanalysisd ANE cache leak — it duplicates a ~64MB
            model into thousands of bundles under com.apple.e5rt.e5bundlecache (hit
            42GB once). The cache is regenerable; purge it and macOS rebuilds a clean
            ~0.6GB copy:

              du -sh ~/Library/Containers/com.apple.mediaanalysisd          # confirm
              killall mediaanalysisd mediaanalysisd-access
              rm -rf ~/Library/Containers/com.apple.mediaanalysisd/Data/Library/Caches/com.apple.mediaanalysisd/com.apple.e5rt.e5bundlecache

            Still tight? brew cleanup -s; docker system prune; empty ~/.Trash.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: system
            model:
              refId: A
              datasource:
                type: influxdb
                uid: system
              query: |
                from(bucket: "system")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "disk" and r._field == "used_percent" and r.path == "/System/Volumes/Data")
                  |> last()
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 90
