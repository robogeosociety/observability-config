apiVersion: 1

# Root notification policy. This is a single-user homelab with one alerting
# concern (stack availability), so the root route sends everything to one place.
# Add nested `routes:` here later if other alerts need different channels.
#
# NOTE: provisioning the root policy makes it read-only in the Grafana UI — the
# same store-as-code stance as dashboards (provider.yml `allowUiUpdates: false`).
policies:
  - orgId: 1
    receiver: discord
    group_by:
      - grafana_folder
      - alertname
    # Fire fast (this is an availability page, not a digest), then back off so a
    # multi-hour outage doesn't spam.
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
