      - uid: freshness-tempest
        title: Collector stalled — Tempest via HA (no writes in 15m)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          component: collector
          collector: tempest
        annotations:
          # embed the matching write-rate panel as the alert screenshot
          __dashboardUid__: collector-freshness
          __panelId__: "3"
          summary: >-
            No new Tempest points in the home_assistant bucket for 15+ minutes.
            The Tempest weather feed (via HA's weatherflow → influxdb export) has
            likely stalled.
          description: >-
            The Tempest feed (sensor.st_00204728_temperature) has had no writes for
            {{ humanizeDuration $values.B.Value }} (last point at
            {{ humanizeTimestamp $values.E.Value }}). HA's weatherflow → influxdb
            export has stalled.
        data:
          # A: seconds since the bucket's most recent write (30d lookback so a long
          # outage resolves a real value, not NoData — the firing value IS the downtime).
          - refId: A
            relativeTimeRange:
              from: 2592000
              to: 0
            datasourceUid: home_assistant
            model:
              refId: A
              datasource:
                type: influxdb
                uid: home_assistant
              query: |
                from(bucket: "home_assistant")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "sensor.st_00204728_temperature")
                  |> keep(columns: ["_time"])
                  |> map(fn: (r) => ({ _value: float(v: uint(v: r._time)) }))
                  |> group()
                  |> max()
                  |> map(fn: (r) => ({ _value: (float(v: uint(v: now())) - r._value) / 1000000000.0 }))
          - refId: B
            relativeTimeRange:
              from: 2592000
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          # C: fire when age > 900s (no writes for 15m).
          - refId: C
            relativeTimeRange:
              from: 2592000
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 900
          # D/E: last-write timestamp (epoch seconds) → humanizeTimestamp in the annotation.
          - refId: D
            relativeTimeRange:
              from: 2592000
              to: 0
            datasourceUid: home_assistant
            model:
              refId: D
              datasource:
                type: influxdb
                uid: home_assistant
              query: |
                from(bucket: "home_assistant")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "sensor.st_00204728_temperature")
                  |> keep(columns: ["_time"])
                  |> map(fn: (r) => ({ _value: float(v: uint(v: r._time)) }))
                  |> group()
                  |> max()
                  |> map(fn: (r) => ({ _value: r._value / 1000000000.0 }))
          - refId: E
            relativeTimeRange:
              from: 2592000
              to: 0
            datasourceUid: __expr__
            model:
              refId: E
              type: reduce
              reducer: last
              expression: D
              datasource:
                type: __expr__
                uid: __expr__
