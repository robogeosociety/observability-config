apiVersion: 1

# Collector freshness — page when a continuously-writing ingest stops landing
# data in its bucket. Each rule counts points over the last 15m; an empty window
# means the collector died (noDataState=Alerting). execErrState=OK so an InfluxDB
# outage pages once via influxdb-availability, not once per collector.
#
# SCOPE — only collectors with a proven continuous cadence are covered, so the
# rules never false-fire:
#   transit_tracker (~5k pts/h), home_assistant (~9k/h), tempest_archive (~3k/h).
# Deliberately EXCLUDED (freshness alerting would just fire on deploy):
#   - mountain — currently stalled / daily; a freshness alert on an already-dead
#     bucket is noise. Fix the collector, don't alert the corpse.
#   - campsites — now continuous (deadline-driven CollectorLoop), but its InfluxDB
#     bucket is fed by a DAILY 07:30 ingest, so it gets its own daily-cadence rule
#     (34h window) in campsite-collector-freshness.yml rather than a 15m one here.
#   - zigbee_archive — event-driven (quiet by design).
#   - claude_code — usage-driven (idle whenever Claude isn't running).
#   - system / ops — covered by influxdb-availability / backup-stale.
groups:
  - orgId: 1
    name: collector-freshness
    folder: Alerts
    interval: 5m
    rules:
      - uid: freshness-transit-tracker
        title: Collector stalled — transit_tracker (no writes in 15m)
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: warning
          component: collector
          collector: transit_tracker
        annotations:
          summary: >-
            No new points in the transit_tracker bucket for 15+ minutes. The
            transit ingest (normally ~5k pts/h) has likely stalled.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: transit_tracker
            model:
              refId: A
              datasource:
                type: influxdb
                uid: transit_tracker
              query: |
                from(bucket: "transit_tracker")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> count()
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1

      - uid: freshness-home-assistant
        title: Collector stalled — home_assistant (no writes in 15m)
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: warning
          component: collector
          collector: home_assistant
        annotations:
          summary: >-
            No new points in the home_assistant bucket for 15+ minutes. The HA
            → InfluxDB feed (normally ~9k pts/h) has likely stalled.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: home_assistant
            model:
              refId: A
              datasource:
                type: influxdb
                uid: home_assistant
              query: |
                from(bucket: "home_assistant")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> count()
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1

      - uid: freshness-tempest
        title: Collector stalled — tempest_archive (no writes in 15m)
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: warning
          component: collector
          collector: tempest_archive
        annotations:
          summary: >-
            No new points in the tempest_archive bucket for 15+ minutes. The
            Tempest weather ingest (normally ~3k pts/h) has likely stalled.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: tempest_archive
            model:
              refId: A
              datasource:
                type: influxdb
                uid: tempest_archive
              query: |
                from(bucket: "tempest_archive")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> count()
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
