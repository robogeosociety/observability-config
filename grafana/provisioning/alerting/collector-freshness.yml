apiVersion: 1

# Collector freshness — page when a continuously-writing ingest stops landing
# data in its bucket. Each rule measures SECONDS SINCE THE LAST WRITE (over a 30d
# lookback) and fires when that exceeds 900s (15m).
#
# noDataState=OK and execErrState=OK: a real stall surfaces as a LARGE AGE on the
# data path (threshold C over the 30d range), never as NoData — within 30 days the
# last point is still there, so the query returns the downtime as a number and
# fires normally. NoData/Error therefore mean the *freshness query itself* failed
# (the 30d age scan is heavy and intermittently times out / returns empty under
# InfluxDB load), NOT that the collector stopped — paging on that is a false
# positive, and a genuine InfluxDB outage already pages once via
# influxdb-availability (the single primary detector). So this rule ignores
# transient NoData/Error and fires only on a real, measured stall.
#
# Why age-of-last-write, not count-in-window: a bare `count()` returns one table
# PER series, which the reduce→threshold evaluator misreads as NoData (false
# fire); and "age" gives us the firing value we want — the downtime — which the
# annotation humanizes ("no writes for 3h 12m, last point at …"). The 30d range
# means even a long outage resolves a real value instead of going NoData.
#
# Each rule carries __dashboardUid__/__panelId__ so the alert embeds that bucket's
# write-rate graph (the `collector-freshness` dashboard).
#
# SCOPE — only collectors with a proven continuous cadence are covered:
#   transit_tracker (~5k pts/h), home_assistant (~9k/h), tempest_archive (~3k/h).
# Deliberately EXCLUDED (freshness alerting would just fire on deploy):
#   - mountain — RETIRED (pipeline migrated to Cloudflare Workers).
#   - campsites — daily ingest, gets its own 34h-window rule (campsite-collector-freshness.yml).
#   - zigbee_archive — event-driven (quiet by design).
#   - claude_code — usage-driven (idle whenever Claude isn't running).
#   - system / ops — covered by influxdb-availability / backup-stale.
groups:
  - orgId: 1
    name: collector-freshness
    folder: Alerts
    interval: 5m
    rules:
      - uid: freshness-transit-tracker
        title: Collector stalled — transit_tracker (no writes in 15m)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          component: collector
          collector: transit_tracker
        annotations:
          # embed the matching write-rate panel as the alert screenshot
          __dashboardUid__: collector-freshness
          __panelId__: "1"
          summary: >-
            No new points in the transit_tracker bucket for 15+ minutes. The
            transit ingest (normally ~5k pts/h) has likely stalled.
          description: >-
            transit_tracker has had no writes for {{ humanizeDuration $values.B.Value }}
            (last point at {{ humanizeTimestamp $values.E.Value }}). The
            transit ingest (normally ~5k pts/h) has stalled.
        data:
          # A: seconds since the bucket's most recent write (30d lookback so a long
          # outage resolves a real value, not NoData — the firing value IS the downtime).
          - refId: A
            relativeTimeRange:
              from: 2592000
              to: 0
            datasourceUid: transit_tracker
            model:
              refId: A
              datasource:
                type: influxdb
                uid: transit_tracker
              query: |
                from(bucket: "transit_tracker")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> keep(columns: ["_time"])
                  |> map(fn: (r) => ({ _value: float(v: uint(v: r._time)) }))
                  |> group()
                  |> max()
                  |> map(fn: (r) => ({ _value: (float(v: uint(v: now())) - r._value) / 1000000000.0 }))
          - refId: B
            relativeTimeRange:
              from: 2592000
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          # C: fire when age > 900s (no writes for 15m).
          - refId: C
            relativeTimeRange:
              from: 2592000
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 900
          # D/E: last-write timestamp (epoch seconds) → humanizeTimestamp in the annotation.
          - refId: D
            relativeTimeRange:
              from: 2592000
              to: 0
            datasourceUid: transit_tracker
            model:
              refId: D
              datasource:
                type: influxdb
                uid: transit_tracker
              query: |
                from(bucket: "transit_tracker")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> keep(columns: ["_time"])
                  |> map(fn: (r) => ({ _value: float(v: uint(v: r._time)) }))
                  |> group()
                  |> max()
                  |> map(fn: (r) => ({ _value: r._value / 1000000000.0 }))
          - refId: E
            relativeTimeRange:
              from: 2592000
              to: 0
            datasourceUid: __expr__
            model:
              refId: E
              type: reduce
              reducer: last
              expression: D
              datasource:
                type: __expr__
                uid: __expr__

