                  |> map(fn: (r) => ({ _value: float(v: uint(v: r._time)) }))
                  |> group()
                  |> max()
                  |> map(fn: (r) => ({ _value: (float(v: uint(v: now())) - r._value) / 1000000000.0 }))
          - refId: B
            relativeTimeRange:
              from: 2592000
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          # C: fire when age > 900s (no writes for 15m).
          - refId: C
            relativeTimeRange:
              from: 2592000
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 900
          # D/E: last-write timestamp (epoch seconds) → humanizeTimestamp in the annotation.
          - refId: D
            relativeTimeRange:
              from: 2592000
              to: 0
            datasourceUid: home_assistant
            model:
              refId: D
              datasource:
                type: influxdb
                uid: home_assistant
              query: |
                from(bucket: "home_assistant")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> keep(columns: ["_time"])
                  |> map(fn: (r) => ({ _value: float(v: uint(v: r._time)) }))
                  |> group()
                  |> max()
                  |> map(fn: (r) => ({ _value: r._value / 1000000000.0 }))
          - refId: E
            relativeTimeRange:
              from: 2592000
              to: 0
            datasourceUid: __expr__
            model:
