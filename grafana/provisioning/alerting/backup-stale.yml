apiVersion: 1

# Backup-staleness rules — one per backup target that heartbeats the ops bucket
# (backup measurement, success=1). If no success lands inside the expected window,
# the safety net has silently rotted — page it. Two targets today:
#   target=local  — InfluxDB daily dump (03:30), influxdb/backup.sh
#   target=r2-dev — /Volumes/dev off-site backup (02:30), backups/dev-backup.sh
# The r2-dev rule was added after a 90-day silent outage: dev-backup.sh exited
# before its heartbeat (missing .env) and nothing watched target=r2-dev, so the
# only off-site copy of the dev disk was absent and invisible.
#
# noDataState=Alerting: an empty window (no success, or only failures) IS the
# alert condition. execErrState=OK: if InfluxDB itself is unreachable the query
# errors, but that's already covered by the influxdb-down rule — don't double-page.
groups:
  - orgId: 1
    name: backups
    folder: Alerts
    interval: 10m
    rules:
      - uid: backup-stale
        title: InfluxDB backup is stale (no success in 26h)
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: warning
          component: backup
        annotations:
          summary: >-
            No successful InfluxDB backup (ops bucket, target=local) in the last
            26 hours. The daily 03:30 dump may be failing silently — check
            ~/Library/Logs/influxdb-backup.log and Full Disk Access for /bin/zsh.
        data:
          - refId: A
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: ops
            model:
              refId: A
              datasource:
                type: influxdb
                uid: ops
              query: |
                from(bucket: "ops")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "backup" and r._field == "success" and r.target == "local" and r._value == 1)
                  |> count()
          - refId: B
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1

      - uid: backup-stale-r2-dev
        title: Dev-disk R2 backup is stale (no success in 26h)
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: warning
          component: backup
        annotations:
          summary: >-
            No successful dev-disk backup (ops bucket, target=r2-dev) in the last
            26 hours. The nightly 02:30 rclone sync of /Volumes/dev → r2://dev-backup
            may be failing silently — check the Nomad job (nomad job status
            -namespace backup dev-backup), the latest /Volumes/dev/backups/logs/
            run log, and that /Volumes/dev/backups/.env exists.
        data:
          - refId: A
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: ops
            model:
              refId: A
              datasource:
                type: influxdb
                uid: ops
              query: |
                from(bucket: "ops")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "backup" and r._field == "success" and r.target == "r2-dev" and r._value == 1)
                  |> count()
          - refId: B
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
