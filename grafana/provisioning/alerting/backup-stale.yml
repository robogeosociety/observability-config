apiVersion: 1

# "InfluxDB backup is stale" — the daily dump (03:30) emits a success=1 heartbeat
# to the ops bucket (backup measurement, target=local). If no successful local
# backup lands in 26h, the safety net has silently rotted — page it.
#
# noDataState=Alerting: an empty 26h window (no success, or only failures) IS the
# alert condition. execErrState=OK: if InfluxDB itself is unreachable the query
# errors, but that's already covered by the influxdb-down rule — don't double-page.
groups:
  - orgId: 1
    name: backups
    folder: Alerts
    interval: 10m
    rules:
      - uid: backup-stale
        title: InfluxDB backup is stale (no success in 26h)
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: warning
          component: backup
        annotations:
          summary: >-
            No successful InfluxDB backup (ops bucket, target=local) in the last
            26 hours. The daily 03:30 dump may be failing silently — check
            ~/Library/Logs/influxdb-backup.log and Full Disk Access for /bin/zsh.
        data:
          - refId: A
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: ops
            model:
              refId: A
              datasource:
                type: influxdb
                uid: ops
              query: |
                from(bucket: "ops")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "backup" and r._field == "success" and r.target == "local" and r._value == 1)
                  |> count()
          - refId: B
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
