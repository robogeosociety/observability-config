apiVersion: 1

# "Weekly note didn't run" — the Monday weekly-note pipeline emits a
# weekly_note,step=pipeline success=1 heartbeat once it has collected data and
# written the note. If none lands in 8 days, Monday's run was missed (launchd not
# firing, repo offline, uv/claude broken) — page it.
#
# success=1 means "the run completed and wrote a note"; per-section faults (e.g.
# calendar TCC) are counted in failed_steps and do NOT suppress this heartbeat, so
# this rule tracks "did the run happen", not "was every section perfect".
#
# noDataState=Alerting: an empty 8-day window IS the alert. execErrState=OK: a
# broken InfluxDB is covered by the influxdb-availability rule — don't double-page.
groups:
  - orgId: 1
    name: weekly-note
    folder: Alerts
    interval: 1h
    rules:
      - uid: weekly-note-stale
        title: Weekly note pipeline missed its run (no success in 8d)
        condition: C
        for: 1h
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: warning
          component: weekly-note
        annotations:
          summary: >-
            No successful weekly-note pipeline run (ops bucket,
            weekly_note step=pipeline) in the last 8 days. Monday's run may have
            been missed — check ~/git-repos/weekly-note.log, the
            com.tommydoerr.weekly-note LaunchAgent, and Full Disk Access.
        data:
          - refId: A
            relativeTimeRange:
              from: 691200
              to: 0
            datasourceUid: ops
            model:
              refId: A
              datasource:
                type: influxdb
                uid: ops
              query: |
                from(bucket: "ops")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "weekly_note" and r._field == "success" and r.step == "pipeline" and r._value == 1)
                  |> group()
                  |> count()
          - refId: B
            relativeTimeRange:
              from: 691200
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 691200
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
