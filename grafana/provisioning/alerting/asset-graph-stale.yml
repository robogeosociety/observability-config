apiVersion: 1

# "Asset graph didn't run" — the Nomad periodic job (obsidian-asset-graph, 07:00
# America/Los_Angeles) refreshes the doit asset layers (transit·weather·github·tokens)
# and emits an asset_graph,step=pipeline success=1 heartbeat via nomad/run-asset-graph.sh.
# If none lands in 26 hours, a daily run was missed (nomad agent down, FDA revoked,
# /Volumes unmounted, InfluxDB unreachable) — page it. 26h gives the 07:00 run slack
# without flapping.
#
# success=1 means "the run completed (rc=0) and synced to iCloud". noDataState=Alerting:
# an empty 26-hour window IS the alert. execErrState=OK: a broken InfluxDB is covered by
# the influxdb-availability rule — don't double-page.
groups:
  - orgId: 1
    name: asset-graph
    folder: Alerts
    interval: 1h
    rules:
      - uid: asset-graph-stale
        title: Asset-graph job missed its run (no success in 26h)
        condition: C
        for: 1h
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: warning
          component: asset-graph
        annotations:
          summary: >-
            No successful obsidian-asset-graph run (ops bucket,
            asset_graph step=pipeline) in the last 26 hours. The 07:00 Nomad refresh may
            have been missed — check `nomad job status obsidian-asset-graph`, the nomad
            agent's Full Disk Access, and nomad/README.md.
        data:
          - refId: A
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: ops
            model:
              refId: A
              datasource:
                type: influxdb
                uid: ops
              query: |
                from(bucket: "ops")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "asset_graph" and r._field == "success" and r.step == "pipeline" and r._value == 1)
                  |> count()
          - refId: B
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 93600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
