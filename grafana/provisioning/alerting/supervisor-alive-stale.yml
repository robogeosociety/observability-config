apiVersion: 1

# obsidian-supervisor liveness — the asyncio loop (launchd com.tommyroar.obsidian-supervisor,
# obsidian-automations `supervisor/`) heartbeats the ops bucket (supervisor_alive measurement,
# alive=1i, shadow="0i") every ~60s via supervisor/heartbeat.py, driven by the status_heartbeat
# cycle in supervisor/supervisord.py. This is the hard backstop the supervisor-loop dashboard's
# own sidecar TODO called for (dashboards.index.d/supervisor-loop.yaml): the dashboard's
# "Heartbeat age" panel shows this same signal, but only pages a human if someone is looking.
#
# This complements, not replaces, obsidian-control-loop-stale: that rule watches the separate
# legacy shell control-loop script, which the supervisor still runs as a supervised child
# (REGISTRY entry `obsidian-control-loop`, kind=service) alongside its own native mirror_pump —
# the two processes can fail independently, so both heartbeats are kept.
#
# noDataState=Alerting: an empty window (no heartbeat) IS the alert condition.
# execErrState=OK: an unreachable InfluxDB is the influxdb-availability rule's job — don't
# double-page.
groups:
  - orgId: 1
    name: supervisor-loop
    folder: Alerts
    interval: 5m
    rules:
      - uid: obsidian-supervisor-alive-stale
        title: obsidian-supervisor asyncio loop is down (no heartbeat in 15m)
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: warning
          component: obsidian-supervisor
        annotations:
          summary: >-
            No obsidian-supervisor heartbeat (ops bucket, supervisor_alive alive=1i shadow="0i")
            in the last 15 minutes. The asyncio loop (launchd com.tommyroar.obsidian-supervisor)
            may be wedged or dead — all REGISTRY jobs (weekly-data, daily-note, the wiki builds,
            the vault-tags/sessions/campsite-inventory event jobs, the served viewer/wiki
            services) stop being scheduled. Check `launchctl list | grep obsidian-supervisor`,
            `curl 127.0.0.1:8787/health`, and `uv run python -m supervisor.supervisord --status`
            from obsidian-automations.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: ops
            model:
              refId: A
              datasource:
                type: influxdb
                uid: ops
              query: |
                from(bucket: "ops")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "supervisor_alive" and r._field == "alive" and r._value == 1 and r.shadow == "0i")
                  |> count()
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
