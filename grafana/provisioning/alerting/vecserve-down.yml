apiVersion: 1

# vecserve liveness — the tommybot tailnet vector-retrieval server (mini) heartbeats the
# `tommybot` bucket (vecserve measurement, alive=1) every ~30s (TOMMYBOT_METRICS_INTERVAL).
# If it dies, the Air (and any other tailnet consumer) silently loses vector search and
# degrades to FTS — not a crash, so nothing else would page for it. See tommybot/vecserve.py.
#
# noDataState=Alerting: an empty window (no heartbeat) IS the alert condition.
# execErrState=OK: if InfluxDB itself is unreachable that's the influxdb-down rule's job —
# don't double-page (same convention as backup-stale.yml / control-loop-stale.yml).
groups:
  - orgId: 1
    name: vecserve
    folder: Alerts
    interval: 1m
    rules:
      - uid: vecserve-down
        title: tommybot vecserve is down (no heartbeat in 5m)
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: warning
          component: vecserve
        annotations:
          summary: >-
            No vecserve heartbeat (tommybot bucket, vecserve alive=1) in the last 5 minutes.
            The tailnet vector server on the mini may be down — the Air (and any other
            consumer) will have silently degraded to local FTS. Check
            `launchctl print gui/$(id -u)/com.tommybot.vecserve` and
            `~/Library/Logs/tommybot-vecserve.log` on the mini, and that
            `tailscale serve status` still fronts :8899.
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: tommybot
            model:
              refId: A
              datasource:
                type: influxdb
                uid: tommybot
              query: |
                from(bucket: "tommybot")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "vecserve" and r._field == "alive" and r._value == 1)
                  |> count()
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
