apiVersion: 1

# "A container was OOM-killed" — telegraf's docker_container_status reports a
# boolean oomkilled per container. This is the runaway-container failure mode the
# per-container mem_limits were added to bound (see the 2026-05-31 watchdog panic):
# a container that breaches its cap is OOM-killed by Docker, and you want to know.
#
# Counts oomkilled==true over 10m per container; any hit fires (the firing instance
# carries the container_name). Plain "container not running" liveness was rejected:
# it's redundant for influxdb (covered by influxdb-down), impossible for grafana
# (can't page on its own death), and noisy for the many ephemeral containers.
#
# noDataState=OK / execErrState=OK: no docker data = telemetry gap, handled by the
# influxdb-down rule, not an OOM.
groups:
  - orgId: 1
    name: containers
    folder: Alerts
    interval: 5m
    rules:
      - uid: container-oomkilled
        title: A container was OOM-killed
        condition: C
        for: 0s
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
          component: docker
        annotations:
          summary: >-
            A container was OOM-killed (hit its memory limit). Check `docker ps`
            and the container's mem_limit — it's either undersized or running away.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: system
            model:
              refId: A
              datasource:
                type: influxdb
                uid: system
              query: |
                from(bucket: "system")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "docker_container_status" and r._field == "oomkilled" and r._value == true)
                  |> count()
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
