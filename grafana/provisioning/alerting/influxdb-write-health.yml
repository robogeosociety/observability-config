apiVersion: 1

# InfluxDB write health — page on data loss or a query-error storm, read from the
# engine's own Prometheus internals (telegraf inputs.prometheus → `system` bucket,
# PR #82; visualised on the influxdb-internals dashboard).
#
# These are CUMULATIVE counters, so each rule alerts on the INCREASE over a 10m
# window (`spread()` = max − min ≈ points/errors added in the window), not the
# absolute total. The firing value IS that increase, humanized in the annotation.
#
# noDataState=OK / execErrState=OK on all three: a metrics gap or query error means
# telegraf/InfluxDB is down, which is the influxdb-availability rule's job (the
# single primary detector) — these secondary rules must not double-page. They fire
# only on a real, measured increase. (Matches disk-space.yml / collector-freshness.yml.)
#
# Thresholds:
#   - err/dropped points  > 0   — any silently lost write is worth a look.
#   - failed queries      > 20  — tolerate the odd malformed ad-hoc query; page only
#                                 on a sustained error storm (a broken dashboard/client).
groups:
  - orgId: 1
    name: influxdb-write-health
    folder: Alerts
    interval: 5m
    rules:
      - uid: influxdb-write-errors
        title: InfluxDB write errors (points failing to write)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          component: influxdb
        annotations:
          __dashboardUid__: influxdb-internals
          __panelId__: "5"
          summary: >-
            InfluxDB errored {{ humanize $values.B.Value }} points in the last 10m
            (storage_writer_err_points). Writes are being rejected — data is being
            lost. Check the InfluxDB Internals dashboard + container logs.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: system
            model:
              refId: A
              datasource:
                type: influxdb
                uid: system
              query: |
                from(bucket: "system")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "storage_writer_err_points" and r._field == "sum")
                  |> spread()
                  |> group()
                  |> sum()
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      - uid: influxdb-dropped-points
        title: InfluxDB dropped points (writes silently discarded)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          component: influxdb
        annotations:
          __dashboardUid__: influxdb-internals
          __panelId__: "6"
          summary: >-
            InfluxDB dropped {{ humanize $values.B.Value }} points in the last 10m
            (storage_writer_dropped_points) — writes accepted but silently discarded
            (often out-of-retention or schema/field-type conflicts). Investigate the
            offending writer.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: system
            model:
              refId: A
              datasource:
                type: influxdb
                uid: system
              query: |
                from(bucket: "system")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "storage_writer_dropped_points" and r._field == "sum")
                  |> spread()
                  |> group()
                  |> sum()
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      - uid: influxdb-failed-queries
        title: InfluxDB query-error storm (>20 failed queries in 10m)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          component: influxdb
        annotations:
          __dashboardUid__: influxdb-internals
          __panelId__: "8"
          summary: >-
            {{ humanize $values.B.Value }} queries failed (compile/runtime errors) in
            the last 10m (qc_requests_total, result != success). A dashboard panel or
            client is likely sending a broken query — check the Query rate by result
            panel on InfluxDB Internals.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: system
            model:
              refId: A
              datasource:
                type: influxdb
                uid: system
              query: |
                from(bucket: "system")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "qc_requests_total" and r._field == "counter" and r.result != "success")
                  |> spread()
                  |> group()
                  |> sum()
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 20
