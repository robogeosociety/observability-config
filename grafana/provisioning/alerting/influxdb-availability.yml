apiVersion: 1

# "InfluxDB is down" availability alert — the notification half of issue #11
# (the 2026-05-31 unmount left InfluxDB down ~4h with no signal).
#
# Detection: telegraf writes host metrics to the `system` bucket every 15s. The
# rule counts points for one cheap, always-present series (cpu/usage_idle on
# cpu-total) over the last 5 minutes and alerts when that count drops below 1.
# This is deliberately a GAP detector, covering both failure modes:
#   - InfluxDB unreachable/down  -> the datasource query errors  -> execErrState
#   - InfluxDB up but no writes   -> the 5m window goes empty      -> noDataState
#     (also catches telegraf/host being down — that's a metrics blackout too)
# Both of those resolve to `Alerting`, so a missing signal pages instead of
# passing silently. A healthy stack returns ~20, so the threshold never trips in
# normal operation.
groups:
  - orgId: 1
    name: stack-availability
    folder: Alerts
    interval: 1m
    rules:
      - uid: influxdb-down
        title: InfluxDB is down (no fresh metrics)
        condition: C
        for: 3m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          component: influxdb
        annotations:
          summary: >-
            No fresh telegraf metrics have reached the InfluxDB `system` bucket
            for 5+ minutes. InfluxDB is likely down or unreachable — every
            dependent service is silently losing writes (see issue #11).
          runbook: >-
            Check `docker ps`/OrbStack for the influxdb container; if /Volumes/dev
            unmounted, remount it and `docker compose -f influxdb/docker-compose.yml
            up -d`. InfluxDB boots into "setup required" (not an empty DB) if the
            mount is missing — data is safe, just remount and restart.
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: system
            model:
              refId: A
              datasource:
                type: influxdb
                uid: system
              query: |
                from(bucket: "system")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "cpu" and r._field == "usage_idle" and r.cpu == "cpu-total")
                  |> count()
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
