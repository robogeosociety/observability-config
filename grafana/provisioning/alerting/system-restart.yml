apiVersion: 1

# System restart + boot-chain alarms — fed by the `boot-validate` Nomad periodic job
# (/Volumes/dev/scripts/nomad/boot-validate.hcl, */5), which emits a `boot_check` heartbeat
# to the ops bucket every 5 min. Companion to the dev-vault task "Unify job management under
# Nomad" (Step 0 "Verify": did the headless boot chain — mount-dev → orbstack-boot →
# nomad-agent → containers — survive a restart, the macOS update included?).
#
# Two rules:
#   1. mac-restarted  — uptime_s reset (< 30m): the Mac rebooted. Informational ping; the
#      job's own re-allocation after a reboot proves nomad-agent + the chain came back up.
#      Auto-resolves once uptime passes the window. Threshold is generous (30m, not 15m)
#      because until the Step-0 keystone lands (nomad-agent → headless LaunchDaemon) the
#      probe can't run until a GUI login, so the first post-boot datapoint may lag the boot.
#   2. boot-chain-degraded — ok=0: the probe ran but the chain came up INCOMPLETE (disk not
#      mounted / OrbStack down / nomad node not ready / influxdb|grafana container missing).
#      Critical. `nomad alloc logs -job boot-validate` shows which sub-check failed.
#
# noDataState=OK / execErrState=OK on BOTH: a *total* outage (nomad or the whole stack down,
# so no boot_check writes at all) can't be detected from inside Grafana — Grafana is itself a
# container in the supervised stack. That's the external host launchd `stack-watchdog`'s job
# (posts straight to Discord). These rules fire only on a REAL, measured signal, never on the
# circular "the thing that would report is itself down" NoData.
groups:
  - orgId: 1
    name: system-restart
    folder: Alerts
    interval: 1m
    rules:
      - uid: mac-restarted
        title: Mac mini restarted (uptime < 30m)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: info
          component: boot
        annotations:
          summary: >-
            tommys-mac-mini rebooted — host uptime is under 30 minutes. The
            boot-validate Nomad job re-allocated, so nomad-agent and the boot chain
            are back up. If this was the planned macOS update, expected; otherwise it
            was an unplanned restart. Auto-resolves once uptime passes 30m.
          description: >-
            Current host uptime {{ humanizeDuration $values.B.Value }} (boot-validate
            heartbeat, ops bucket). Verify the rest of the chain via the
            boot-chain-degraded rule / `nomad alloc logs -job boot-validate`.
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: ops
            model:
              refId: A
              datasource:
                type: influxdb
                uid: ops
              query: |
                from(bucket: "ops")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "boot_check" and r._field == "uptime_s")
                  |> last()
          - refId: B
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1800

      - uid: boot-chain-degraded
        title: Boot chain came up degraded (ok=0)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
          component: boot
        annotations:
          summary: >-
            boot-validate reports the headless boot chain is INCOMPLETE (ok=0): one of
            /Volumes/dev mounted, OrbStack engine up, nomad node ready, or the
            influxdb+grafana core containers is failing. Run
            `nomad alloc logs -job boot-validate` to see which sub-check failed.
          description: >-
            The boot-validate heartbeat (ops bucket) reports ok=0 — the chain
            mount-dev → orbstack-boot → nomad-agent → core containers did not come up
            whole. Check the failing tier; on a fresh reboot give the engine a minute
            to warm (the job retries once before this fires).
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: ops
            model:
              refId: A
              datasource:
                type: influxdb
                uid: ops
              query: |
                from(bucket: "ops")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "boot_check" and r._field == "ok")
                  |> last()
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
