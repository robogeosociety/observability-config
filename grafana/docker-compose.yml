services:
  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: grafana
    restart: unless-stopped
    # Resource caps = 50% of the OrbStack VM (4 CPU / 4096 MiB). Limits blast
    # radius: a runaway container is OOM-killed by Docker, not allowed to thrash
    # the whole VM into host swap (see the 2026-05-31 watchdog panic).
    mem_limit: 2048m
    cpus: 2.0
    pids_limit: 512
    ports:
      # Bound to loopback ONLY. Grafana's auth proxy (below) trusts the
      # Tailscale-User-Login header, so the port must be unreachable from the LAN
      # — otherwise anyone on the network could spoof that header and log in as
      # anyone. `tailscale serve` (host) reaches it on 127.0.0.1; host-local
      # tooling (telegraf/coordination health probes, integration tests) uses
      # localhost:3001; containers use the docker network (grafana:3000).
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # Provisioning relocated OFF the external /Volumes/dev disk to internal
      # storage (the external disk's unmount/TCC fragility broke containers on
      # 2026-05-31). Canonical source stays version-controlled in ./provisioning;
      # run ./deploy-provisioning.sh to sync repo -> internal and restart grafana.
      - /Users/tommydoerr/.observability/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Home dashboard = the Stack Catalog (ops/stack-catalog.json), set via config
      # so it's store-as-code (not a live org-preference API write). NOTE: this is a
      # compose env change — applying it needs `docker compose up -d grafana`
      # (recreate); the coordinator's `docker restart` alone won't pick it up.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/ops/stack-catalog.json"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_INSTALL_PLUGINS: "yesoreyeram-infinity-datasource,vertamedia-clickhouse-datasource,volkovlabs-echarts-panel"
      INFLUX_GRAFANA_TOKEN: ${INFLUX_GRAFANA_TOKEN}
      # Read-only Cloudflare token (Account Analytics: Read) for the Workers
      # Analytics Engine SQL API — feeds the collector-history dashboard.
      CF_ANALYTICS_TOKEN: ${CF_ANALYTICS_TOKEN}
      # Same scope (Account Analytics: Read) for the campsites_ae ClickHouse
      # datasource — feeds the campsite-collector-history + live-availability dashboards.
      GF_SERVER_ROOT_URL: "https://tommys-mac-mini.tail59a169.ts.net:3000"
      # User login via Tailscale identity (auth proxy) — replaces Google OAuth, so
      # there is no Google Cloud dependency. `tailscale serve` fronts Grafana on the
      # tailnet (https://…ts.net:3000 -> 127.0.0.1:3001) and injects the
      # authenticated caller as Tailscale-User-* headers (stripping any client-sent
      # copies); Grafana trusts that header. The loopback port bind (above) is what
      # makes this safe — only `tailscaled` can reach Grafana, so the header can't be
      # spoofed from the LAN. WHITELIST = the Docker-NAT source (grafana_default
      # subnet) that Grafana sees the proxied request arrive from. The admin login
      # form stays enabled as a break-glass (a header misfire can't lock you out).
      # Service-account / basic-auth / render-token requests bypass the proxy, so the
      # MCP, ask-dash, renderer, and health probes are unaffected.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "Tailscale-User-Login"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_HEADERS: "Email:Tailscale-User-Login Name:Tailscale-User-Name"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_SYNC_TTL: "60"
      GF_AUTH_PROXY_WHITELIST: "192.168.117.0/24"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: "Admin"
      # Server-side panel rendering (PNG via /render/...). Grafana calls the
      # renderer, which loads panels back from Grafana via the callback URL.
      GF_RENDERING_SERVER_URL: "http://renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"
      # Embed a panel screenshot in alert notifications: rules carry
      # __dashboardUid__/__panelId__ annotations, Grafana renders that panel via
      # the renderer above and attaches the PNG to the Discord embed (the
      # "offending graph"). Needs the renderer (present) + a container recreate.
      GF_UNIFIED_ALERTING_SCREENSHOTS_CAPTURE: "true"
      # Discord contact point for the stack-availability alert (provisioning/
      # alerting/). Expanded into contactpoints.yml via $__env{} at provisioning
      # time so the channel webhook URL never lives in a committed file.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
    depends_on:
      - renderer
    networks:
      - default
      - influxdb_default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q 'ok' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Server-side panel renderer. Produces deterministic PNGs of single panels
  # (Grafana /render/d-solo/...), used for ad-hoc troubleshooting and the visual
  # regression tier. Pinned by digest for reproducibility.
  renderer:
    image: grafana/grafana-image-renderer:latest@sha256:a30a68c2de11a1aad5733452536ac50fbc2f3958e6d0aa046ef9eb56db7c6a6d
    container_name: grafana-renderer
    restart: unless-stopped
    # Resource caps = 50% of the OrbStack VM (4 CPU / 4096 MiB).
    mem_limit: 2048m
    cpus: 2.0
    pids_limit: 512
    environment:
      ENABLE_METRICS: "false"
      RENDERING_MODE: "default"
    networks:
      - default

volumes:
  grafana_data:

networks:
  influxdb_default:
    external: true
