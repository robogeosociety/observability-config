services:
  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: grafana
    restart: unless-stopped
    # Resource caps = 50% of the OrbStack VM (4 CPU / 4096 MiB). Limits blast
    # radius: a runaway container is OOM-killed by Docker, not allowed to thrash
    # the whole VM into host swap (see the 2026-05-31 watchdog panic).
    mem_limit: 2048m
    cpus: 2.0
    pids_limit: 512
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # Provisioning relocated OFF the external /Volumes/dev disk to internal
      # storage (the external disk's unmount/TCC fragility broke containers on
      # 2026-05-31). Canonical source stays version-controlled in ./provisioning;
      # run ./deploy-provisioning.sh to sync repo -> internal and restart grafana.
      - /Users/tommydoerr/.observability/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_INSTALL_PLUGINS: "yesoreyeram-infinity-datasource,vertamedia-clickhouse-datasource,volkovlabs-echarts-panel"
      INFLUX_GRAFANA_TOKEN: ${INFLUX_GRAFANA_TOKEN}
      # Read-only Cloudflare token (Account Analytics: Read) for the Workers
      # Analytics Engine SQL API — feeds the collector-history dashboard.
      CF_ANALYTICS_TOKEN: ${CF_ANALYTICS_TOKEN}
      # Same scope (Account Analytics: Read) for the campsites_ae ClickHouse
      # datasource — feeds the campsite-collector-history + live-availability dashboards.
      GF_SERVER_ROOT_URL: "https://tommys-mac-mini.tail59a169.ts.net:3000"
      GF_AUTH_GOOGLE_ENABLED: "true"
      GF_AUTH_GOOGLE_NAME: "Google (passkey)"
      GF_AUTH_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GF_AUTH_GOOGLE_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GF_AUTH_GOOGLE_SCOPES: "openid email profile"
      GF_AUTH_GOOGLE_AUTH_URL: "https://accounts.google.com/o/oauth2/v2/auth"
      GF_AUTH_GOOGLE_TOKEN_URL: "https://oauth2.googleapis.com/token"
      GF_AUTH_GOOGLE_API_URL: "https://openidconnect.googleapis.com/v1/userinfo"
      GF_AUTH_GOOGLE_ALLOWED_EMAILS: "tommy.b.doerr@gmail.com"
      GF_AUTH_GOOGLE_ALLOW_SIGN_UP: "true"
      GF_AUTH_GOOGLE_SKIP_ORG_ROLE_SYNC: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: "Admin"
      # Server-side panel rendering (PNG via /render/...). Grafana calls the
      # renderer, which loads panels back from Grafana via the callback URL.
      GF_RENDERING_SERVER_URL: "http://renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"
    depends_on:
      - renderer
    networks:
      - default
      - influxdb_default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q 'ok' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Server-side panel renderer. Produces deterministic PNGs of single panels
  # (Grafana /render/d-solo/...), used for ad-hoc troubleshooting and the visual
  # regression tier. Pinned by digest for reproducibility.
  renderer:
    image: grafana/grafana-image-renderer:latest@sha256:a30a68c2de11a1aad5733452536ac50fbc2f3958e6d0aa046ef9eb56db7c6a6d
    container_name: grafana-renderer
    restart: unless-stopped
    # Resource caps = 50% of the OrbStack VM (4 CPU / 4096 MiB).
    mem_limit: 2048m
    cpus: 2.0
    pids_limit: 512
    environment:
      ENABLE_METRICS: "false"
      RENDERING_MODE: "default"
    networks:
      - default

volumes:
  grafana_data:

networks:
  influxdb_default:
    external: true
