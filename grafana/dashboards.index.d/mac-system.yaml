# Dashboard intent (conf.d — one file per dashboard uid so concurrent PRs never
# collide on a shared index. Tests + drift-sentinel glob this dir and merge;
# duplicate uid across files is a hermetic CI failure.)

mac-system:
  title: Mac System
  file: infra/mac-system.json
  purpose: Host CPU/load/mem/swap/disk/net for the Mac mini (Telegraf -> Influx `system`) plus a btop-style
    whole-system process treemap from the dev-status collector (:8077/processes.json).
  datasources:
  - influxdb
  - infinity
  source:
    repo: robogeosociety/observability-config
    ref: main
    paths:
    - telegraf/telegraf.conf
    - grafana/dev-status/server.py
    produces:
      bucket: system
      via: telegraf
    cadence: 15s
    status: active
  intent: btop-at-a-glance for the mini that hosts the whole stack — one screen for "is the machine healthy
    and what's eating it."
  todos:
  - Per-core CPU sparklines
  - CPU temperature / thermal panel (needs a collector that reads the SMC — no metric source yet)
  - Memory-pressure alerting (esp. after the 2026-05-31 VM-swap watchdog panic)
  - Treemap depends on the host collector being deployed via dev-status/deploy.sh
