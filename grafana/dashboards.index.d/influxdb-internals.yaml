# Dashboard intent (conf.d — one file per dashboard uid so concurrent PRs never
# collide on a shared index. Tests + drift-sentinel glob this dir and merge;
# duplicate uid across files is a hermetic CI failure.)

influxdb-internals:
  title: InfluxDB Internals
  file: infra/influxdb-internals.json
  purpose: 'InfluxDB engine/operational self-monitoring from its native Prometheus /metrics (scraped by
    Telegraf into the `system` bucket): write throughput/errors/dropped, query rate by result + query-controller
    state, HTTP API request rate by status, HTTP I/O bytes, BoltDB meta-store ops, and instance inventory
    + uptime. Counters shown as per-second rates.'
  datasources:
  - influxdb
  source:
    repo: robogeosociety/observability-config
    ref: main
    paths:
    - telegraf/telegraf.conf
    produces:
      bucket: system
      via: telegraf
    cadence: 60s
    status: active
    note: 'Fed by the telegraf inputs.prometheus scrape of InfluxDB :8086/metrics added in PR #82 (namedrop
      trims ~2,600 raw series to ~50 by dropping the *_duration_seconds histograms, per-shard storage_*
      families, and go/promhttp/process runtime). Counter measurements (storage_writer_*, qc_requests_total,
      http_*_total, boltdb_*) are rendered with derivative(); gauges (qc_*_active, influxdb_*_total, uptime)
      as-is.'
  intent: 'The operational complement to influxdb-buckets: that board answers "how big / how busy is each
    bucket" (named storage + throughput, custom collector); this one answers "is the InfluxDB engine healthy
    — writing, querying, erroring?" from the engine''s own Prometheus internals. Together they''re the
    hybrid the collector-standardization arc landed on.'
  todos:
  - Alert on storage_writer_err_points / _dropped_points > 0 and on failed-query rate
  - Add API latency once a bounded way to keep the *_duration_seconds histograms is found
  - Per-org / per-bucket query attribution if InfluxDB ever exposes it in /metrics
