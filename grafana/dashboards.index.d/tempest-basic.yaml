# Dashboard intent (conf.d — one file per dashboard uid so concurrent PRs never
# collide on a shared index. Tests + drift-sentinel glob this dir and merge;
# duplicate uid across files is a hermetic CI failure.)

tempest-basic:
  title: Tempest — Basic
  file: weather/tempest-basic.json
  purpose: Tempest weather-station readout — temp/humidity/pressure, wind (live/avg/gust/direction), solar/UV/illuminance,
    rain, lightning, and battery (Influx `tempest_archive`).
  datasources:
  - influxdb
  source:
    produces:
      bucket: tempest_archive
      via: external-collector
    status: external
    note: Tempest hub (home-weather-hub repo) writes the tempest_archive bucket; repo TBD
  intent: Home weather-station dashboard — current conditions and recent trends.
  todos:
  - Derived comfort metrics (dew point, heat index, wind chill)
  - A daily / period-rollup row
