# Dashboard intent (conf.d — one file per dashboard uid so concurrent PRs never
# collide on a shared index. Tests + drift-sentinel glob this dir and merge;
# duplicate uid across files is a hermetic CI failure.)

walksheds-uptime:
  title: Walksheds Uptime
  file: ops/walksheds-uptime.json
  purpose: Uptime/deploy status for the walksheds project from the `ops` bucket — status stat plus a "Deploys"
    annotation off the `deploy` measurement (service=walksheds).
  datasources:
  - influxdb
  source:
    produces:
      bucket: ops
      via: external-service
    status: external
    note: walksheds project writes its own uptime/deploy heartbeats to the ops bucket; repo TBD
  intent: At-a-glance liveness + deploy timeline for walksheds, matching the shared ops/uptime pattern
    used by the other project status dashboards.
  todos:
  - Add latency / last-success-age panels to match the status-page treatment
