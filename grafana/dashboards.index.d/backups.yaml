# Dashboard intent (conf.d — one file per dashboard uid so concurrent PRs never
# collide on a shared index. Tests + drift-sentinel glob this dir and merge;
# duplicate uid across files is a hermetic CI failure.)

backups:
  title: Backups
  file: ops/backups.json
  purpose: Last-success age, result, and size per backup target (local InfluxDB, R2 offsite, Obsidian
    vault) from the `ops` bucket `backup` measurement.
  datasources:
  - influxdb
  source:
    repo: tommyroar/observability-config
    ref: main
    paths:
    - influxdb/backup.sh
    - influxdb/r2_upload.py
    produces:
      bucket: ops
      via: launchd-backup
    cadence: 24h
    status: active
  intent: Answer "did every backup run, and is it fresh?" at a glance. Each target is a last-success-age
    + result + size trio fed by the backup heartbeats.
  todos:
  - R2 offsite shows NOT CONFIGURED until the scoped R2 token from terraform/ lands in influxdb/.env
  - Alert when a target's last-success age exceeds its backup interval
  - Size-trend thresholds to catch silent truncation or runaway growth
