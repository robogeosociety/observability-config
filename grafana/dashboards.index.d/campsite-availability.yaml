# Dashboard intent (conf.d — one file per dashboard uid so concurrent PRs never
# collide on a shared index. Tests + drift-sentinel glob this dir and merge;
# duplicate uid across files is a hermetic CI failure.)

campsite-availability:
  title: Campsite Availability — Overview
  file: campsites/campsite-availability.json
  purpose: 'System-wide *live* campsite availability overview, sourced entirely from Cloudflare
    Analytics Engine (`campsite_availability` dataset): site-nights available, % reserved,
    fully-booked campgrounds, per-agency split, per-campground latest, and watched hot dates.
    Always "now"; no time-range history. Interactive per-night / per-site exploration has moved
    to the webapp.'
  datasources:
  - analytics-engine
  source:
    repo: tommyroar/robot-geographical-society
    ref: main
    paths:
    - src/
    produces:
      dataset: campsite_availability
      via: cloudflare-worker
    cadence: continuous
    status: active
    note: Fed directly by the RGS collector Worker's Analytics Engine writes (same upstream as
      campsite-collector-history). No host-side ingest — the launchd `campsite-ingest` job and the
      `campsites` InfluxDB bucket were retired in the 2026-06 native-Cloudflare migration
      (`Cloudflare-migration-plan.md`).
  cloud_provenance:
    audited: '2026-06-20'
    cloud_copy: Cloudflare Analytics Engine (campsite_availability) + R2 (campsite-raw)
    replaceable: true
    reason: 'Fully cloud-native after the migration: every panel reads Analytics Engine via the
      `campsites_ae` datasource. No InfluxDB dependency remains. AE retention is ~3 months — this
      overview is current-state only, so that is sufficient; long-horizon trend lives in the Demand
      / Predictions dashboards (also moving to AE) and full interactive history in the webapp.'
  intent: The "how booked is everything right now" lens — system-wide, all-nights live state. The
    former "how is a chosen night filling up" InfluxDB history section and the per-site drill-down
    were retired 2026-06-20; that interactive use-case is now the webapp
    (campsites.robogeosociety.xyz), which does it better (map, per-site calendar, survival/layout views).
  notes:
  - AE-only. The agency/campsite template variables are now sourced from AE (`campsite_availability`,
    GROUP BY blob2/blob3) and scope the overview panels; the night-specific InfluxDB variables
    (target_date/loop/site) were removed with the explorer section.
  - Deprecation banner (top text panel) links interactive users to the webapp.
  todos:
  - Optional follow-up — add an AE-backed multi-day trend row (SUM(double1) over $timeSeries on
    campsite_availability) if a time view is wanted back on this dashboard.
  - Consider retiring this dashboard entirely once Demand/Predictions are on AE and the webapp is
    the accepted explorer (decide after the live review).
