# Dashboard intent (conf.d — one file per dashboard uid so concurrent PRs never
# collide on a shared index. Tests + drift-sentinel glob this dir and merge;
# duplicate uid across files is a hermetic CI failure.)

transit-station-availability:
  title: Transit — Station Data Availability
  file: transit/transit-station-availability.json
  purpose: Per-station (stop_id) trip_prediction availability — stations reporting, prediction volume
    per station over time, live-vs-scheduled split, a coverage table, and a per-station freshness (last-seen)
    table, so a stop that goes quiet or all-scheduled is obvious (Influx).
  datasources:
  - influxdb
  source:
    produces:
      bucket: transit_tracker
      via: external-service
    cadence: 1m
    status: external
    note: derived from the trip_prediction measurement's stop_id / is_realtime tags
  intent: 'The OBA station-coverage view (issue #16) — complements transit-tracker-monitor''s per-stop
    realtime breakdown by making *data availability and freshness* per station first-class. trip_prediction
    is continuous, so panels stay strict (no allow-empty) and give real nodata protection.'
  todos:
  - Per-station "no data in N min" alert once more stops are tracked
  - Geo/station-name mapping so stop_ids read as place names
