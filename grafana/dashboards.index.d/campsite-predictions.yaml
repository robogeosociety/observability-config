# Dashboard intent (conf.d — one file per dashboard uid so concurrent PRs never
# collide on a shared index. Tests + drift-sentinel glob this dir and merge;
# duplicate uid across files is a hermetic CI failure.)

campsite-predictions:
  title: Campsite Predictions
  file: campsites/campsite-predictions.json
  purpose: 'Prediction-readiness gauge (plus its component sub-scores and history) for the sell-out model:
    how much usable collection history exists and whether predictions can be trusted yet. Reads the
    `campsite_readiness` Cloudflare Analytics Engine dataset (singleton row per daily run).'
  datasources:
  - analytics-engine
  source:
    repo: tommyroar/robot-geographical-society
    ref: main
    paths:
    - backend/src/readiness-workflow.ts
    produces:
      dataset: campsite_readiness
      via: cloudflare-worker
    cadence: 24h
    status: active
    note: Readiness is computed by the RGS ReadinessWorkflow (a daily Cloudflare Workflow that scans ~60
      days of R2 sites/ history) and written to the `campsite_readiness` AE dataset. Ported from
      robot-geographical-society predict/readiness.py; replaced the host campsites/ingest.py compute in the
      2026-06 native-Cloudflare migration. Panels take the latest singleton via argMax(timestamp); the two
      time-series panels use $timeSeries/$timeFilter and build up one point per daily run.
  intent: Make "can we trust sell-out predictions yet?" a first-class, visible signal. The gauge fills
    as history accrues (geometric mean of events, coverage, and depth, so one lagging term holds it down);
    the band gates whether the model's ETAs are surfaced — hidden / low-confidence / shown.
  notes:
  - AE-only. double1..13 = readiness, event_score, coverage, depth_score, events, active_cells, cells,
    median_depth, history_months, expected_accuracy, campgrounds, collect_days, ready_eta_days; blob1=band;
    index1="readiness". Verified rendering against the live AE row 2026-06-21 (readiness 0.735, directional).
  todos:
  - Add per-cohort readiness (which date/site classes are still data-starved).
  - Add C2-vs-C1 backtest panels once readiness clears the directional band.
