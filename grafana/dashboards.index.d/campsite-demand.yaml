# Dashboard intent (conf.d — one file per dashboard uid so concurrent PRs never
# collide on a shared index. Tests + drift-sentinel glob this dir and merge;
# duplicate uid across files is a hermetic CI failure.)

campsite-demand:
  title: Campsite Demand
  file: campsites/campsite-demand.json
  purpose: 'Where campgrounds are filling up: most in-demand campgrounds, the hottest nights
    (weekends/holidays that fill first), and a campground×night booking heatmap — all from the
    Cloudflare Analytics Engine `campsite_demand` dataset (per-campground per-night, soonest ~240
    nights). Per-individual-site demand (survival / soonest-to-run-out) is the webapp''s job.'
  datasources:
  - analytics-engine
  source:
    repo: tommyroar/robot-geographical-society
    ref: main
    paths:
    - backend/src/workflows.ts
    produces:
      dataset: campsite_demand
      via: cloudflare-worker
    cadence: continuous
    status: active
    note: The RGS collector Worker writes one campsite_demand row per campground per target night
      per run (collectSite, soonest 240 nights); queries take the latest snapshot per cell via
      argMax(timestamp). Replaced the host ingest.py site_demand/campground_demand InfluxDB
      aggregation in the 2026-06 native-Cloudflare migration (Cloudflare-migration-plan.md).
  intent: The demand lens complementing campsite-availability. Now AE-backed like the rest of the
    campsite dashboards. The former per-individual-site panel ("most in-demand sites — fewest nights
    left") was dropped — that granularity isn't in AE (only per-campground is); the webapp's Survival
    view (campsites.robogeosociety.xyz) covers it.
  notes:
  - AE-only. agency/campsite template variables are sourced from AE (campsite_availability, GROUP BY
    blob2/blob3) and filter the panels via IN (${var:singlequote}).
  - 'The two tables use latest-snapshot AE queries (argMax over timestamp). The by-night strip
    ("Demand by upcoming night — % booked") is a single-series state-timeline keyed on
    toDateTime(blob1); the dashboard time range is set forward (now → now+90d) so future nights
    land on its axis (the tables use fixed now()-48h windows, so the forward range does not affect
    them). Verified rendering against live partial data 2026-06-21.'
  - 'Why not a campground×night heatmap: vertamedia/ClickHouse builds series from numeric COLUMNS,
    not from a dynamic row-label, so ~138 campgrounds can''t be per-row series over a night axis.
    The per-campground × night grid + per-site survival live in the webapp
    (campsites.robogeosociety.xyz); Grafana keeps the system-wide (var-sliceable) by-night view.'
  todos:
  - 'campsite_demand fills as the CollectorLoop continues-as-new onto the demand-writing code
    (~16/138 campgrounds at repoint time); panels are correct now and complete as coverage grows.'
  - Lead-time / burn-down once enough history accrues (robot-geographical-society#70).
