# Dashboard intent (conf.d — one file per dashboard uid so concurrent PRs never
# collide on a shared index. Tests + drift-sentinel glob this dir and merge;
# duplicate uid across files is a hermetic CI failure.)

status-page:
  title: Project Status
  file: ops/status-page.json
  purpose: Cross-project up/latency and 24h/7d/30d uptime (Influx `uptime`) plus live dev deployments
    and tailscale-serve routes from the dev-status collector (via Infinity).
  datasources:
  - influxdb
  - infinity
  source:
    repo: tommyroar/observability-config
    ref: main
    paths:
    - grafana/dev-status/server.py
    produces:
      bucket: ops
      via: host-collector
    cadence: 1m
    status: active
  intent: A single "is everything up?" pane spanning monitored services and live dev deployments.
  todos:
  - Define the incidents panel's source
  - Per-service alerting / SLO targets
  - Dedupe the service list against the uptime probe config
