# Dashboard intent index — the "why" behind each dashboard, as code.
#
# The JSON in provisioning/dashboards/ is the "what" (panels, queries, layout).
# This file captures the *intent* the JSON can't: what question the dashboard
# answers, the design rationale, and the concrete improvements we want next.
# Read it before changing a dashboard; record follow-ups here instead of losing
# them.
#
# Location note: this lives in grafana/ (NOT provisioning/dashboards/) on
# purpose. Grafana's dashboard provider scans provisioning/dashboards/ for
# *.yaml provider configs and would try to parse this file as one and error.
# Keeping it a sibling of provisioning/ keeps it out of Grafana's way while
# still version-controlled next to the dashboards it documents.
#
# Dashboards are organized into domain folders under provisioning/dashboards/
# (infra/ ops/ campsites/ transit/ weather/ dev/); Grafana derives a folder per
# subdir (provider.yml `foldersFromFilesStructure: true`). Every dashboard change
# also appends an entry to `changelog.jsonl` (validated by test_changelog.py).
#
# Keyed by dashboard `uid` (must match the JSON). Each entry:
#   title:        human title — must equal the JSON `title` (kept in sync by test)
#   file:         path UNDER provisioning/dashboards/, incl. the domain folder
#                 (e.g. infra/mac-system.json)
#   purpose:      one line — what it shows and from where
#   datasources:  friendly names, must match what the JSON panels actually use:
#                   influxdb         -> influxdb
#                   infinity         -> yesoreyeram-infinity-datasource
#                   analytics-engine -> vertamedia-clickhouse-datasource (Cloudflare AE)
#   source:       data PROVENANCE — which code produces this dashboard's data, so
#                 drift (the upstream pipeline changing/migrating) is detectable.
#                 The drift-sentinel + collector-freshness alerts read this.
#                   repo:     owner/name on GitHub that owns the producing code
#                             (omit when status: external and the repo is unknown)
#                   ref:      branch to track (default: main)
#                   paths:    code whose change could break this dashboard
#                   produces: { bucket: <influx bucket> | dataset: <AE>, via: <how> }
#                             via: telegraf | launchd-ingest | launchd-collector |
#                                  launchd-backup | host-collector | cf-analytics-engine |
#                                  home-assistant | external-service | external-script
#                   cadence:  expected write rhythm (15s|5m|24h…) — powers the
#                             freshness threshold + anomaly baseline
#                   status:   active   — produced by a repo we track here
#                             external — produced upstream; repo may be TBD
#                             migrated — pipeline moved; dashboard retired/repointed
#                             deprecated
#                   monitor:  (optional) "skip" to exclude from the drift-sentinel's
#                             data-freshness/anomaly checks — for usage/event-driven
#                             buckets where idle != broken (e.g. claude_code).
#   intent:       the design rationale / who-and-what it's for
#   todos:        future improvements — the backlog that drives development
#   status:       (optional) "pending" for a dashboard documented ahead of being
#                 committed; lets the index lead the JSON without failing CI.
#
# test_dashboard_index.py keeps this honest: every committed dashboard JSON must
# have an entry here, titles/files/datasources must match the JSON, an index
# entry with no JSON is only allowed when status: pending, and a `source:` block
# (when present) must carry a `produces` + `status`, with `repo` required when
# status is `active`.

backups:
  title: Backups
  file: ops/backups.json
  purpose: >-
    Last-success age, result, and size per backup target (local InfluxDB, R2
    offsite, Obsidian vault) from the `ops` bucket `backup` measurement.
  datasources: [influxdb]
  source:
    repo: tommyroar/observability-config
    ref: main
    paths: [influxdb/backup.sh, influxdb/r2_upload.py]
    produces: { bucket: ops, via: launchd-backup }
    cadence: 24h
    status: active
  intent: >-
    Answer "did every backup run, and is it fresh?" at a glance. Each target is
    a last-success-age + result + size trio fed by the backup heartbeats.
  todos:
    - R2 offsite shows NOT CONFIGURED until the scoped R2 token from terraform/ lands in influxdb/.env
    - Alert when a target's last-success age exceeds its backup interval
    - Size-trend thresholds to catch silent truncation or runaway growth

campsite-availability:
  title: Campsite Availability
  file: campsites/campsite-availability.json
  purpose: >-
    Campsite availability in two sections: a live system-wide snapshot from
    Cloudflare AE (site-nights available, % reserved, fully-booked campgrounds,
    per-agency, per-campground latest, watched hot dates) and a per-night history
    from the `campsites` InfluxDB bucket (totals, booked %, the available/booked
    trend, booked-by-agency, per-campsite table for a chosen target date).
  datasources: [analytics-engine, influxdb]
  source:
    repo: tommyroar/observability-config
    ref: main
    paths: [campsites/]
    produces: { bucket: campsites, via: launchd-ingest }
    cadence: 24h
    status: active
    note: >-
      Primary source is the in-repo daily ingest into the `campsites` InfluxDB
      bucket (the history section). The live section reads the Cloudflare
      Analytics Engine dataset (external, same upstream scraper Worker as
      campsite-collector-history) for low-latency current state.
  intent: >-
    One home for both availability lenses — "how booked is everything right now"
    (live/AE, all nights) and "how is a chosen night filling up" (history/Influx,
    burn-down + forecast). Merged from campsite-availability-metrics +
    campsite-live-availability (2026-06-02) to end their documented overlap.
  notes:
    - >-
      Mixed-datasource dashboard. The target_date/agency/campsite variables drive
      ONLY the history (Influx) section; the live (AE) section is system-wide and
      ignores them. target_date is filtered to today-and-future (computed in-Flux
      from now(), this Flux build lacks date.format) and sorted ascending, so the
      history section opens on the soonest upcoming night rather than an empty
      past date. The time picker drives the history trend; the live section is "now".
  todos:
    - Optionally wire the agency filter into the live (AE) section too
    - '"Watched hot dates" is a manual list — source it from collector config'
    - Daily granularity on the history side; sub-day would need the AE/live path

campsite-collector-history:
  title: Collector History
  file: campsites/campsite-collector-history.json
  purpose: >-
    Collector pipeline health from Cloudflare Analytics Engine plus R2 storage —
    collection rate + 30d total, per-agency coverage, step durations, top failing
    sites, and R2 stored bytes/object count.
  datasources: [analytics-engine, infinity]
  source:
    produces: { dataset: analytics-engine, via: cf-analytics-engine }
    status: external
    note: produced by the deadline-driven CollectorLoop in tommyroar/robot-geographical-society (Worker -> AE); R2 storage via the Cloudflare GraphQL API
  intent: >-
    Ops/reliability view of the collector pipeline — is it running, how fully is
    it covering the tracked sites, and what's breaking.
  notes:
    - >-
      AE timeseries/aggregate panels follow the dashboard time picker via the
      vertamedia macros ($timeSeries for adaptive bucketing, $timeFilter for the
      range; each target carries dateTimeColDataType=timestamp). They previously
      hardcoded `timestamp > now() - INTERVAL '30'/'7' DAY`, so any picker range
      shorter than the data span (e.g. a remembered now-24h) plotted an empty
      viewport and read as nodata. The "Latest collection" stat keeps fixed
      24h/2d health windows on purpose (it's a right-now status tile, not a range
      view); the R2 stats already keyed off ${__from}.
  todos:
    - Continuous model — legacy run panels retired; '140' is hard-coded, could derive it
    - AE retention is ~90d — note the ceiling on history depth
    - Staleness alerting now lives in campsite-collector-freshness.yml (Discord)

mac-system:
  title: Mac System
  file: infra/mac-system.json
  purpose: >-
    Host CPU/load/mem/swap/disk/net for the Mac mini (Telegraf -> Influx
    `system`) plus a btop-style whole-system process treemap from the dev-status
    collector (:8077/processes.json).
  datasources: [influxdb, infinity]
  source:
    repo: tommyroar/observability-config
    ref: main
    paths: [telegraf/telegraf.conf, grafana/dev-status/server.py]
    produces: { bucket: system, via: telegraf }
    cadence: 15s
    status: active
  intent: >-
    btop-at-a-glance for the mini that hosts the whole stack — one screen for
    "is the machine healthy and what's eating it."
  todos:
    - Per-core CPU sparklines
    - CPU temperature / thermal panel (needs a collector that reads the SMC — no metric source yet)
    - Memory-pressure alerting (esp. after the 2026-05-31 VM-swap watchdog panic)
    - Treemap depends on the host collector being deployed via dev-status/deploy.sh

status-page:
  title: Project Status
  file: ops/status-page.json
  purpose: >-
    Cross-project up/latency and 24h/7d/30d uptime (Influx `uptime`) plus live
    dev deployments and tailscale-serve routes from the dev-status collector
    (via Infinity).
  datasources: [influxdb, infinity]
  source:
    repo: tommyroar/observability-config
    ref: main
    paths: [grafana/dev-status/server.py]
    produces: { bucket: ops, via: host-collector }
    cadence: 1m
    status: active
  intent: >-
    A single "is everything up?" pane spanning monitored services and live dev
    deployments.
  todos:
    - Define the incidents panel's source
    - Per-service alerting / SLO targets
    - Dedupe the service list against the uptime probe config

tempest-basic:
  title: Tempest — Basic
  file: weather/tempest-basic.json
  purpose: >-
    Tempest weather-station readout — temp/humidity/pressure, wind
    (live/avg/gust/direction), solar/UV/illuminance, rain, lightning, and
    battery (Influx `tempest_archive`).
  datasources: [influxdb]
  source:
    produces: { bucket: tempest_archive, via: external-collector }
    status: external
    note: Tempest hub (home-weather-hub repo) writes the tempest_archive bucket; repo TBD
  intent: >-
    Home weather-station dashboard — current conditions and recent trends.
  todos:
    - Derived comfort metrics (dew point, heat index, wind chill)
    - A daily / period-rollup row

transit-tracker-basic:
  title: Transit Tracker — Basic
  file: transit/transit-tracker-basic.json
  purpose: >-
    OneBusAway transit-display app metrics — clients, API calls/errors/throttle,
    cache, OBA latency, message throughput, predictions, next departures, and
    realtime-vs-scheduled (Influx).
  datasources: [influxdb]
  source:
    produces: { bucket: transit_tracker, via: external-service }
    cadence: 1m
    status: external
    note: transit-tracker project writes the transit_tracker bucket; repo TBD
  intent: >-
    Combined operational + product view of the transit display — health and
    what riders see, on one dashboard.
  todos:
    - SLO / error-budget panels
    - Clarify the split vs transit-tracker-monitor (what belongs where)

transit-tracker-monitor:
  title: Transit Tracker — Network Monitor
  file: transit/transit-tracker-monitor.json
  purpose: >-
    Network-topology lens on the transit proxy — OBA -> Proxy -> Displays flow,
    clients, API calls/throttle/errors, latency, proxied messages by route, WS
    connects, recent trips, plus a Realtime Coverage row (live-vs-scheduled
    trips, coverage %, and a per-stop breakdown) off the trip_prediction
    is_realtime tag (Influx).
  datasources: [influxdb]
  source:
    produces: { bucket: transit_tracker, via: external-service }
    cadence: 1m
    status: external
    note: same transit-tracker project as transit-tracker-basic; repo TBD
  intent: >-
    The topology/plumbing view that complements transit-tracker-basic — focused
    on the proxy and its network rather than rider-facing output. The Realtime
    Coverage row surfaces upstream OBA gaps (e.g. Judkins Park 40_E01) where the
    sign silently falls back to GTFS schedule.
  todos:
    - Document the overlap with transit-tracker-basic
    - Per-route alerting on proxied-message dropout
    - Alert when realtime coverage % drops below threshold for a sustained window

walksheds-uptime:
  title: Walksheds Uptime
  file: ops/walksheds-uptime.json
  purpose: >-
    Uptime/deploy status for the walksheds project from the `ops` bucket —
    status stat plus a "Deploys" annotation off the `deploy` measurement
    (service=walksheds).
  datasources: [influxdb]
  source:
    produces: { bucket: ops, via: external-service }
    status: external
    note: walksheds project writes its own uptime/deploy heartbeats to the ops bucket; repo TBD
  intent: >-
    At-a-glance liveness + deploy timeline for walksheds, matching the shared
    ops/uptime pattern used by the other project status dashboards.
  todos:
    - Add latency / last-success-age panels to match the status-page treatment

orbstack-containers:
  title: OrbStack — Container Monitoring
  file: infra/orbstack-containers.json
  purpose: >-
    Per-container CPU/mem/net/blkio for the OrbStack Docker containers from
    Telegraf's `inputs.docker` (docker_container_* measurements) in the `system`
    bucket — reading the OrbStack socket as the host user.
  datasources: [influxdb]
  source:
    repo: tommyroar/observability-config
    ref: main
    paths: [telegraf/telegraf.conf]
    produces: { bucket: system, via: telegraf }
    cadence: 15s
    status: active
  intent: >-
    Visibility into the containers that run the stack (influxdb, grafana,
    renderer) so an outage or a runaway container is seen, not silent — the
    monitoring half of the 2026-05-31 InfluxDB-down incident response.
  todos:
    - Alert when the influxdb container is down / unreachable
    - Surface per-container restart counts and OOM-kills

ha-pi-system:
  title: Home Assistant Pi — System
  file: infra/ha-pi-system.json
  purpose: >-
    Host CPU/load/temp/memory/swap/disk/network for the Home Assistant Raspberry
    Pi, sourced from HA's System Monitor integration forwarded to the
    `home_assistant` bucket (measurement `sensor.system_monitor_*`, field
    `value`) via HA's InfluxDB integration.
  datasources: [influxdb]
  source:
    produces: { bucket: home_assistant, via: home-assistant }
    status: external
    note: HA System Monitor → HA InfluxDB integration on the Pi (LAN IP); no repo
  intent: >-
    The HA-native counterpart to mac-system. Unlike the Telegraf-fed ha-system
    dashboard (which expects cpu/mem measurements in the `system` bucket), this
    reads HA's own System Monitor entity schema — because the Pi has no Telegraf
    and HAOS add-on containers can't route to the mini over Tailscale, so HA's
    built-in forwarder (over the LAN IP) is the data path that actually works.
  todos:
    - Enable more System Monitor entities (per-mount disks, more interfaces) if wanted — they default to disabled_by integration
    - 'CPU temp is °F (HA System Monitor reports °F); panel set accordingly'

claude-usage:
  title: Claude Code — Token Usage
  file: dev/claude-usage.json
  purpose: >-
    Claude Code token usage on this Mac — tokens by hour (stacked by class),
    highest-usage sessions, and cache-vs-real split — from the `claude_code`
    InfluxDB bucket fed by grafana/claude-usage-collector/ parsing
    ~/.claude/projects/**/*.jsonl message `usage` blocks.
  datasources: [influxdb]
  source:
    repo: tommyroar/observability-config
    ref: main
    paths: [grafana/claude-usage-collector/collector.py]
    produces: { bucket: claude_code, via: launchd-collector }
    cadence: 5m
    status: active
    monitor: skip   # usage-driven — only writes when Claude runs, so idle != broken
  intent: >-
    Answer "how many tokens is Claude Code burning, and is caching working?"
    Cost is deliberately OUT of scope — transcripts carry no cost and a per-model
    price table silently rots, so we track raw token counts only. Tokens are shown
    as four distinct classes (cache-read dominates real sessions), never one
    number — that's what the cache-vs-real panel exists to surface. Full design
    (bucket, collector cursor/idempotency, schema, panels) is in
    grafana/SPEC-claude-usage.md. The collector follows the dev-status rule (edit
    in-repo, deploy.sh copies to the internal disk, launchd runs it) because
    launchd is TCC-blocked from /Volumes.
  todos:
    - Live since 2026-06-01 — `claude_code` bucket + collector (launchd com.tommy.claude-usage, 5 min) active; backfilled ~18.6k points
    - More panels — tokens by model, tokens by project, web search/fetch use, avg tokens/message
    - Headline stat row (tokens today / this month, cache-hit ratio, messages/day)
    - Revisit `session` tag cardinality if it ever balloons (fine for single-user now)
    - Heartbeat to the `ops` bucket so collector liveness shows on the Backups/status pattern

obsidian-backups:
  title: Obsidian Backups — per vault
  file: ops/obsidian-backups.json
  purpose: >-
    Per-vault Obsidian backup freshness, result, and size from the `ops` bucket
    `backup` measurement (target=obsidian) — last-success age, size trend, and a
    last-run table, grouped by the `vault` tag.
  datasources: [influxdb]
  source:
    produces: { bucket: ops, via: external-script }
    cadence: 24h
    status: external
    note: obsidian fan-out backup script emits target=obsidian heartbeats (obsidian-tbd repo automations/); repo TBD
  intent: >-
    Drill-down companion to the top-level Backups dashboard. The Obsidian vault
    is being split into multiple vaults backed up by a fan-out script that emits
    a per-vault heartbeat; the single "Obsidian vault" stat on `backups` can't
    show WHICH vault went stale. Built to be forward-compatible: it groups by the
    `vault` tag, but the tag isn't live yet, so today the single Obsidian backup
    shows as one tile/row labelled `tbd` — it fans out into camping/gear/dev/home
    automatically once the fan-out script tags its heartbeat. Full design in
    grafana/SPEC-obsidian-backups.md.
  todos:
    - Heartbeat lacks the `vault` tag yet — shows one `tbd` series until the fan-out backup script tags per-vault (obsidian-tbd repo automations/)
    - No `changed`-files field is emitted yet — the spec's "files changed per run" panel is dropped until it is
    - Alert when any vault's last-success age exceeds the backup interval
    - Size-trend thresholds per vault to catch silent truncation

transit-alerts:
  title: Transit — Service Alerts
  file: transit/transit-alerts.json
  purpose: >-
    OBA service_alert visibility — active-alert count, alert-points by reason,
    an over-time band and a per-alert active/clear state-timeline, and a table of
    the latest summary + affected routes/stops, so disruptions (and why realtime
    coverage dropped) are visible at a glance (Influx).
  datasources: [influxdb]
  source:
    produces: { bucket: transit_tracker, via: external-service }
    cadence: 1m
    status: external
    note: transit-tracker writes a service_alert point per active alert each poll (transit-tracker-tui PR #67)
  intent: >-
    The disruption lens that pairs with transit-tracker-monitor's realtime-coverage
    row — when a coverage dip appears there, this dashboard shows the alert (e.g. a
    2 Line shuttle closure) that caused it. Alerts are event-driven, so panels are
    legitimately empty on a quiet day (allow-empty in dashboard_coverage.yaml).
  todos:
    - Overlay service_alert periods as annotations on the trips graph (issue #23 item 3)
    - Alert when a high-severity service_alert stays active beyond a threshold

transit-station-availability:
  title: Transit — Station Data Availability
  file: transit/transit-station-availability.json
  purpose: >-
    Per-station (stop_id) trip_prediction availability — stations reporting,
    prediction volume per station over time, live-vs-scheduled split, a coverage
    table, and a per-station freshness (last-seen) table, so a stop that goes
    quiet or all-scheduled is obvious (Influx).
  datasources: [influxdb]
  source:
    produces: { bucket: transit_tracker, via: external-service }
    cadence: 1m
    status: external
    note: derived from the trip_prediction measurement's stop_id / is_realtime tags
  intent: >-
    The OBA station-coverage view (issue #16) — complements transit-tracker-monitor's
    per-stop realtime breakdown by making *data availability and freshness* per
    station first-class. trip_prediction is continuous, so panels stay strict (no
    allow-empty) and give real nodata protection.
  todos:
    - Per-station "no data in N min" alert once more stops are tracked
    - Geo/station-name mapping so stop_ids read as place names

collector-freshness:
  title: Collector Freshness
  file: ops/collector-freshness.json
  purpose: >-
    Write-rate per minute for each continuously-fed bucket (transit_tracker,
    home_assistant, tempest_archive). A line dropping to 0 (or No data) for 15m is
    exactly what the `collector-freshness` alert rules fire on — and each rule
    embeds its matching panel here as the alert's screenshot (the "offending graph").
  datasources: [influxdb]
  source:
    produces: { bucket: ops, via: derived }
    cadence: continuous
    status: external
    note: derived from per-bucket point counts; no collector of its own
  intent: >-
    The visual companion to the collector-freshness alerting rules. Built so each
    rule's __dashboardUid__/__panelId__ can screenshot the exact write-rate graph
    into Discord, so a "Collector stalled" alert arrives with the flatline shown,
    not just described. Panels are legitimately empty when a collector is actually
    stalled (that's the point), so the dashboard is allow-empty in the nodata suite.
  todos:
    - Add a last-write-age stat row per bucket
    - Fold in campsites (daily cadence) once its 34h-window panel shape is settled

alerts-anomalies:
  title: Alerts & Anomalies
  file: ops/alerts-anomalies.json
  purpose: >-
    One place for "what's wrong / what's weird": Grafana's built-in firing+pending
    alert list (standard pattern), plus a window z-score anomaly view off the
    ops.anomaly event stream the anomaly-detector writes — z-scores over time,
    counts by metric, and a recent-anomalies table with the baseline each point
    deviated from.
  datasources: [influxdb]
  source:
    repo: tommyroar/observability-config
    ref: main
    paths: [grafana/anomaly-detector/]
    produces: { bucket: ops, via: launchd-collector }
    cadence: 10m
    status: active
    monitor: skip
    note: anomaly events are event-driven (none when healthy) — excluded from freshness/anomaly monitoring
  intent: >-
    Alerts use the standard built-in alertlist (free). Native anomaly detection is
    a paid Grafana Cloud/ML feature, so anomalies are our own metric-math (window
    z-score) written as an event stream — the telemetry that lets a scheduled
    Claude pass analyse history + raw metrics and PR detection-config updates over
    time (anomaly-detector/anomaly-detection.yaml is the store-as-code config).
  todos:
    - Add a verdict (true/false-positive) label per event as the tuning signal
    - Hour-of-day baselines so the diurnal ramp isn't flagged
    - Scheduled Claude pass that PRs anomaly-detection.yaml tweaks from the event history
