# ops-summarizer Worker CD — deploy, secret sync, and a live end-to-end check.
#
# `environment: production` is load-bearing, not decoration: org secrets resolve
# to length 0 without it (rgs — six CD lanes learned this the hard way). The
# verify job below reports the resolved length precisely so that failure mode is
# visible rather than silent.
name: ops-summarizer
on:
  push:
    branches: [main]
    paths: ["workers/ops-summarizer/**", ".github/workflows/ops-summarizer.yml"]
  pull_request:
    paths: ["workers/ops-summarizer/**", ".github/workflows/ops-summarizer.yml"]
  workflow_dispatch:

concurrency: ops-summarizer

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: workers/ops-summarizer }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test "test/*.test.mjs"

  deploy:
    if: github.event_name != 'pull_request'
    needs: [test]
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run: { working-directory: workers/ops-summarizer }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: wrangler deploy
        run: npx wrangler@4 deploy

      # The GitHub App this Worker uses to fire repository_dispatch. Reused from
      # deploy-gate rather than minting a second long-lived GitHub credential.
      #
      # No ANTHROPIC_API_KEY: this lane runs the model in Actions on the
      # subscription (`claude -p`), so a key here would be a second, metered path
      # to the same answers.
      - name: sync Worker secrets
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          HANDLER_TOKEN: ${{ secrets.OPS_SUMMARIZER_TOKEN }}
        run: |
          printf '%s' "$APP_ID"          | npx wrangler@4 secret put APP_ID
          printf '%s' "$APP_PRIVATE_KEY" | npx wrangler@4 secret put APP_PRIVATE_KEY
          printf '%s' "$HANDLER_TOKEN"   | npx wrangler@4 secret put HANDLER_TOKEN
